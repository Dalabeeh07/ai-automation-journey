ب للأسفل والـ `ceil` للأعلى، وكذلك مع الأعداد السالبة."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << toupper('a');", "stdin": null, "options": ["a", "97", "A", "65"], "answer": 3, "why_en": "`toupper` returns an int: the code of `'A'`, which is 65.", "why_ar": "الدالة `toupper` ترجع int: رمز الحرف `'A'` وهو 65.", "mono": true, "id": "sec-9-q2", "n": 15, "tag": "3.3 · Built-in functions", "ref": "sec-9:3", "ref_label": "3.3 · Built-in functions", "idea_en": "`toupper` and `tolower` return an int (the character code). Store the result in a `char`, or cast it, to see the letter.", "idea_ar": "الدالتان `toupper` و`tolower` ترجعان int (رمز الحرف). خزّن النتيجة في `char` أو استخدم cast لترى الحرف."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << sqrt(pow(3, 2) + pow(4, 2));", "stdin": null, "options": ["25", "12", "5", "7"], "answer": 2, "why_en": "pow(3,2) = 9 and pow(4,2) = 16, the sum is 25, and sqrt(25) = 5.", "why_ar": "‏pow(3,2) = 9 و pow(4,2) = 16 والمجموع 25 و sqrt(25) = 5.", "mono": true, "id": "sec-9-q3", "n": 16, "tag": "3.3 · Built-in functions", "ref": "sec-9:0", "ref_label": "3.3 · Built-in functions", "idea_en": "`pow`, `sqrt`, `floor`, `ceil` and `fabs` come from `<cmath>` and return a double. `floor` rounds down and `ceil` rounds up, also for negative numbers.", "idea_ar": "الدوال `pow` و`sqrt` و`floor` و`ceil` و`fabs` من `<cmath>` وترجع double. الـ `floor` تقرّب للأسفل والـ `ceil` للأعلى، وكذلك مع الأعداد السالبة."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "char c = toupper('q');\ncout << c;", "stdin": null, "options": ["Q", "q", "81", "113"], "answer": 0, "why_en": "The int result is stored in a `char`, which prints as the letter Q.", "why_ar": "الناتج int يُخزَّن في `char` فيُطبع كحرف Q.", "mono": true, "id": "sec-9-q4", "n": 17, "tag": "3.3 · Built-in functions", "ref": "sec-9:3", "ref_label": "3.3 · Built-in functions", "idea_en": "`toupper` and `tolower` return an int (the character code). Store the result in a `char`, or cast it, to see the letter.", "idea_ar": "الدالتان `toupper` و`tolower` ترجعان int (رمز الحرف). خزّن النتيجة في `char` أو استخدم cast لترى الحرف."}, {"stem_en": "Which header do you include to use `pow` and `sqrt`?", "stem_ar": "أي header تضمّنه لاستخدام `pow` و`sqrt`؟", "code": null, "stdin": null, "options": ["<string>", "<cctype>", "<iomanip>", "<cmath>"], "answer": 3, "why_en": "Math functions live in `<cmath>`.", "why_ar": "الدوال الرياضية موجودة في `<cmath>`.", "mono": false, "id": "sec-9-q5", "n": 18, "tag": "3.3 · Built-in functions", "ref": "sec-9:0", "ref_label": "3.3 · Built-in functions", "idea_en": "`pow`, `sqrt`, `floor`, `ceil` and `fabs` come from `<cmath>` and return a double. `floor` rounds down and `ceil` rounds up, also for negative numbers.", "idea_ar": "الدوال `pow` و`sqrt` و`floor` و`ceil` و`fabs` من `<cmath>` وترجع double. الـ `floor` تقرّب للأسفل والـ `ceil` للأعلى، وكذلك مع الأعداد السالبة."}], "quiz_secs": ["sec-7", "sec-8", "sec-9"]}, {"id": "ch-4", "kicker": "Chapter 4", "title_en": "Selection", "title_ar": "جمل الاختيار", "intro_en": "Making decisions: conditions, logical operators, if / else, switch and assert.", "intro_ar": "اتخاذ القرارات: الشروط والعوامل المنطقية و if / else و switch و assert.", "sections": [{"id": "sec-10", "num": "4.1", "title_en": "Conditions and logical operators", "title_ar": "الشروط والعوامل المنطقية", "blocks": [{"t": "list", "ordered": false, "en": ["Relational operators: `==  !=  <  <=  >  >=`. The result is `true` (1) or `false` (0).", "Logical operators, strongest first: `!` (not), `&&` (and), `||` (or).", "Any value other than 0 counts as **true**, including `-1` and `0.1`. Only 0 is false."], "ar": ["عوامل المقارنة: ‏`==  !=  <  <=  >  >=`. النتيجة `true` (1) أو `false` (0).", "العوامل المنطقية من الأقوى: ‏`!` (not) ثم `&&` (and) ثم `||` (or).", "أي قيمة غير 0 تُعتبر **true**، بما في ذلك `-1` و`0.1`. فقط 0 تعني false."]}, {"t": "table", "en": {"head": ["a", "b", "a && b", "a || b", "!a"], "rows": [["T", "T", "T", "T", "F"], ["T", "F", "F", "T", "F"], ["F", "T", "F", "T", "T"], ["F", "F", "F", "F", "T"]]}, "ar": {"head": ["a", "b", "a && b", "a || b", "!a"], "rows": [["T", "T", "T", "T", "F"], ["T", "F", "F", "T", "F"], ["F", "T", "F", "T", "T"], ["F", "F", "F", "F", "T"]]}}, {"t": "code", "code": "cout << (true || false && false) << endl;\ncout << ((true || false) && false) << endl;\ncout << (!true || true) << endl;\nint x = 5;\ncout << (x > 3 && x < 10) << endl;\ncout << (!x) << endl;\ncout << (5 && 0) << (5 || 0) << endl;\ncout << (5 > 3 > 2) << endl;\ncout << (5 + 2 > 6 && 3 * 2 == 6) << endl;", "stdin": null, "out": "1\n0\n1\n1\n0\n01\n0\n1", "en": "`&&` binds tighter than `||`, so the first line is `true || (false && false)`. In `5 > 3 > 2`, the first part gives 1, and `1 > 2` is false.", "ar": "الـ `&&` أقوى من `||`، لذلك السطر الأول هو `true || (false && false)`. وفي `5 > 3 > 2` الجزء الأول يعطي 1 ثم `1 > 2` خاطئة."}, {"t": "p", "en": "**Short-circuit evaluation:** in `A && B`, if A is false then B is never evaluated. In `A || B`, if A is true then B is never evaluated. This is also how you avoid dividing by zero: `if (x != 0 && y / x > 1)`.", "ar": "**التقييم المختصر (short-circuit):** في `A && B` إذا كانت A خاطئة فلا يُقيَّم B أبداً. وفي `A || B` إذا كانت A صحيحة فلا يُقيَّم B أبداً. وبهذا تتجنب القسمة على صفر: `if (x != 0 && y / x > 1)`."}, {"t": "code", "code": "int a = 0, b = 0;\nif (a == 0 || ++b > 0) cout << \"T \";\ncout << a << \" \" << b << endl;\nint c = 0, d = 0;\nif (c != 0 && ++d > 0) cout << \"T \"; else cout << \"F \";\ncout << c << \" \" << d << endl;\nint e = 1, f = 0;\nif (e == 1 && ++f > 0) cout << \"T \";\ncout << e << \" \" << f << endl;", "stdin": null, "out": "T 0 0\nF 0 0\nT 1 1", "en": "In the first two cases `++b` and `++d` are skipped. Only the third case runs both sides.", "ar": "في أول حالتين يُتجاوز `++b` و`++d`. فقط الحالة الثالثة تنفّذ الطرفين."}, {"t": "code", "code": "int x = 3;\nif (x = 5)\n    cout << \"A\" << endl;\nelse\n    cout << \"B\" << endl;\ncout << x << endl;", "stdin": null, "out": "A\n5", "en": "`x = 5` is an **assignment**, not a comparison. It stores 5 in `x`, and the value 5 counts as true.", "ar": "`x = 5` هي **إسناد** وليست مقارنة. تخزّن 5 في `x` والقيمة 5 تُعتبر true."}, {"t": "code", "code": "int x = 3;\nif (x > 10);\n    cout << \"inside\" << endl;\ncout << \"done\" << endl;", "stdin": null, "out": "inside\ndone", "en": "The `;` ends the `if` immediately, so the `cout` below always runs.", "ar": "الفاصلة المنقوطة `;` تنهي الـ `if` فوراً، لذلك الـ `cout` التي تحتها تعمل دائماً."}, {"t": "code", "code": "int x = 5;\nif (10 < x < 12) cout << \"yes\"; else cout << \"no\";\ncout << endl;", "stdin": null, "out": "yes", "en": "`10 < x` gives 0 (false), and then `0 < 12` is true. The correct test is `x > 10 && x < 12`.", "ar": "`10 < x` تعطي 0 (false) ثم `0 < 12` صحيحة. الاختبار الصحيح هو `x > 10 && x < 12`."}, {"t": "trap", "en": "Three classics: `=` instead of `==`, a stray `;` after `if (...)`, and chained comparisons like `10 < x < 12`.", "ar": "ثلاثة أخطاء كلاسيكية: `=` بدل `==`، وفاصلة منقوطة زائدة بعد `if (...)`، والمقارنات المتسلسلة مثل `10 < x < 12`."}]}, {"id": "sec-11", "num": "4.2", "title_en": "if, else, switch and assert", "title_ar": "جمل if و else و switch و assert", "blocks": [{"t": "list", "ordered": false, "en": ["In an `if / else if / else` chain, only the **first** true branch runs. So order matters.", "Use `{ }` to group several statements into one block.", "An `else` belongs to the **nearest** `if`, no matter how the code is indented.", "The conditional operator: `condition ? value_if_true : value_if_false`."], "ar": ["في سلسلة `if / else if / else` يُنفَّذ **أول** فرع صحيح فقط. لذلك الترتيب مهم.", "استخدم `{ }` لتجميع عدة جمل في كتلة واحدة.", "الـ `else` تتبع **أقرب** `if` بغض النظر عن المسافات البادئة.", "العامل الشرطي: ‏`condition ? قيمة_إذا_صح : قيمة_إذا_خطأ`."]}, {"t": "code", "code": "int score = 85;\nif (score >= 50) cout << \"pass\" << endl;\nelse if (score >= 80) cout << \"good\" << endl;\nelse cout << \"fail\" << endl;", "stdin": null, "out": "pass", "en": "85 matches the first test, so `good` is never reached. Put the strictest test first.", "ar": "85 تحقق الشرط الأول، فلا يصل الكود إلى `good`. ضع الشرط الأشد أولاً."}, {"t": "code", "code": "int x = 5, y = 3;\nif (x > 3)\n    if (y > 5)\n        cout << \"A\" << endl;\nelse\n    cout << \"B\" << endl;\ncout << \"end\" << endl;", "stdin": null, "out": "B\nend", "en": "The `else` is lined up with the outer `if`, but it belongs to `if (y > 5)`. Since `y > 5` is false, B is printed. This is the **dangling else**.", "ar": "الـ `else` محاذية للـ `if` الخارجية لكنها تتبع `if (y > 5)`. وبما أن `y > 5` خاطئة تُطبع B. هذا هو الـ **dangling else**."}, {"t": "code", "code": "int a = 7, b = 3;\nint m = (a > b) ? a : b;\ncout << m << endl;\ncout << (a % 2 == 0 ? \"even\" : \"odd\") << endl;", "stdin": null, "out": "7\nodd", "en": "", "ar": ""}, {"t": "list", "ordered": false, "en": ["The `switch` expression must be **integral**: `int`, `char`, `bool` or `enum`. Not `double`, not `string`.", "Each `case` label must be a **constant**, not a variable.", "Without `break`, execution **falls through** into the next case. `default` is optional."], "ar": ["تعبير الـ `switch` يجب أن يكون **integral**: ‏`int` أو `char` أو `bool` أو `enum`. وليس `double` ولا `string`.", "كل `case` يجب أن تكون **ثابتاً** وليس متغيراً.", "بدون `break` يستمر التنفيذ إلى الـ case التالية (**fall-through**). والـ `default` اختيارية."]}, {"t": "code", "code": "int n = 2;\nswitch (n) {\n    case 1: cout << \"one \";\n    case 2: cout << \"two \";\n    case 3: cout << \"three \";\n    default: cout << \"other \";\n}\ncout << endl;\nchar g = 'B';\nswitch (g) {\n    case 'A': cout << \"Excellent\"; break;\n    case 'B':\n    case 'C': cout << \"Good\"; break;\n    default: cout << \"Unknown\";\n}\ncout << endl;", "stdin": null, "out": "two three other \nGood", "en": "The first switch has no `break`, so it falls through to the end. In the second, `'B'` and `'C'` share one statement.", "ar": "الـ switch الأولى بدون `break` فتكمل حتى النهاية. وفي الثانية يشترك `'B'` و`'C'` في جملة واحدة."}, {"t": "p", "en": "**`assert(condition);`** (from `<cassert>`) stops the program with an error message when the condition is false, and does nothing when it is true. It is for checking your own assumptions while developing, not for validating user input.", "ar": "**`assert(condition);`** (من `<cassert>`) توقف البرنامج مع رسالة خطأ عندما يكون الشرط خاطئاً، ولا تفعل شيئاً عندما يكون صحيحاً. تُستخدم للتحقق من افتراضاتك أثناء التطوير، وليس للتحقق من مدخلات المستخدم."}, {"t": "code", "code": "#include <iostream>\n#include <cassert>\nusing namespace std;\nint main() {\n    int x = -1;\n    assert(x > 0);\n    cout << \"after\" << endl;\n    return 0;\n}", "stdin": null, "out": "a.out: /tmp/tmp547ubw40/main.cpp:6: int main(): Assertion `x > 0' failed.", "en": "The program aborts at the failed `assert`, so `after` is never printed. The exact wording of the message depends on the compiler.", "ar": "يتوقف البرنامج عند الـ `assert` الفاشلة، فلا تُطبع `after`. صياغة الرسالة بالضبط تعتمد على الـ compiler."}, {"t": "trap", "en": "Always check the `break` statements in a `switch`, and read an `else` as belonging to the nearest `if`.", "ar": "افحص دائماً جمل `break` في الـ `switch`، واقرأ الـ `else` على أنها تتبع أقرب `if`."}]}], "quiz": [{"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << (true || false && false);", "stdin": null, "options": ["1", "false", "0", "true"], "answer": 0, "why_en": "`&&` first: false && false = false; then true || false = true, which prints 1.", "why_ar": "أولاً `&&`: false && false = false، ثم true || false = true وتُطبع 1.", "mono": true, "id": "sec-10-q0", "n": 1, "tag": "4.1 · Conditions and logical operators", "ref": "sec-10:0", "ref_label": "4.1 · Conditions and logical operators", "idea_en": "Comparisons give 1 or 0. `!` is the strongest, then `&&`, then `||`. Any non-zero value counts as true.", "idea_ar": "المقارنات تعطي 1 أو 0. الـ `!` الأقوى ثم `&&` ثم `||`. وأي قيمة غير صفرية تعتبر true."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int x = 5;\ncout << (10 < x < 12);", "stdin": null, "options": ["0", "false", "1", "Compile error"], "answer": 2, "why_en": "`10 < 5` is 0, then `0 < 12` is true (1). It compiles and prints 1.", "why_ar": "‏`10 < 5` تعطي 0 ثم `0 < 12` صحيحة (1). الكود يُترجَم ويطبع 1.", "mono": true, "id": "sec-10-q1", "n": 2, "tag": "4.1 · Conditions and logical operators", "ref": "sec-10:7", "ref_label": "4.1 · Conditions and logical operators", "idea_en": "`10 < x < 12` is read as `(10 < x) < 12`: a 0 or 1 compared with 12, so it is always true. Use `x > 10 && x < 12`. The same goes for `5 > 3 > 2`.", "idea_ar": "‏`10 < x < 12` تُقرأ `(10 < x) < 12`: أي 0 أو 1 تُقارَن بـ 12 فتكون صحيحة دائماً. استخدم `x > 10 && x < 12`. وكذلك `5 > 3 > 2`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int x = 3;\nif (x = 5) cout << \"A\"; else cout << \"B\";\ncout << x;", "stdin": null, "options": ["A5", "B5", "A3", "B3"], "answer": 0, "why_en": "`x = 5` assigns 5, which is true, so A is printed and x is now 5.", "why_ar": "‏`x = 5` تُسند 5 وهي true فتُطبع A ويصبح x ‏5.", "mono": true, "id": "sec-10-q2", "n": 3, "tag": "4.1 · Conditions and logical operators", "ref": "sec-10:5", "ref_label": "4.1 · Conditions and logical operators", "idea_en": "`=` assigns and `==` compares. `if (x = 5)` stores 5 in x, and the value 5 counts as true.", "idea_ar": "الـ `=` للإسناد والـ `==` للمقارنة. والجملة `if (x = 5)` تخزّن 5 في x والقيمة 5 تعتبر true."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int x = 3;\nif (x > 10);\n    cout << \"inside\\n\";\ncout << \"done\\n\";", "stdin": null, "options": ["inside", "done", "inside\ndone", "done\ninside"], "answer": 2, "why_en": "The `;` makes an empty `if`. Both `cout` lines always run.", "why_ar": "الفاصلة المنقوطة تجعل الـ `if` فارغاً، فتعمل الجملتان دائماً.", "mono": true, "id": "sec-10-q3", "n": 4, "tag": "4.1 · Conditions and logical operators", "ref": "sec-10:6", "ref_label": "4.1 · Conditions and logical operators", "idea_en": "A `;` right after `if (...)` is an empty statement, so the line below it runs every time.", "idea_ar": "الفاصلة المنقوطة `;` بعد `if (...)` مباشرة جملة فارغة، فالسطر الذي تحتها يعمل في كل الأحوال."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int a = 5, b = 0;\nif (a > 3 || ++b) cout << \"T\"; else cout << \"F\";\ncout << b;", "stdin": null, "options": ["F0", "T1", "F1", "T0"], "answer": 3, "why_en": "`a > 3` is already true, so `++b` is skipped (short-circuit). b stays 0.", "why_ar": "‏`a > 3` صحيحة أصلاً فيُتجاوز `++b` (short-circuit) وتبقى b ‏0.", "mono": true, "id": "sec-10-q4", "n": 5, "tag": "4.1 · Conditions and logical operators", "ref": "sec-10:3", "ref_label": "4.1 · Conditions and logical operators", "idea_en": "Short-circuit: in `A && B` a false A skips B; in `A || B` a true A skips B. So side effects such as `++b` may never run.", "idea_ar": "Short-circuit: في `A && B` إذا كانت A خاطئة يُتجاوز B، وفي `A || B` إذا كانت A صحيحة يُتجاوز B. لذلك قد لا تُنفَّذ آثار جانبية مثل `++b`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << (5 > 3 > 2);", "stdin": null, "options": ["0", "Compile error", "true", "1"], "answer": 0, "why_en": "`5 > 3` is 1, and then `1 > 2` is 0.", "why_ar": "‏`5 > 3` تعطي 1 ثم `1 > 2` تعطي 0.", "mono": true, "id": "sec-10-q5", "n": 6, "tag": "4.1 · Conditions and logical operators", "ref": "sec-10:7", "ref_label": "4.1 · Conditions and logical operators", "idea_en": "`10 < x < 12` is read as `(10 < x) < 12`: a 0 or 1 compared with 12, so it is always true. Use `x > 10 && x < 12`. The same goes for `5 > 3 > 2`.", "idea_ar": "‏`10 < x < 12` تُقرأ `(10 < x) < 12`: أي 0 أو 1 تُقارَن بـ 12 فتكون صحيحة دائماً. استخدم `x > 10 && x < 12`. وكذلك `5 > 3 > 2`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int x = 2, y = 9;\nif (x > 5)\n    if (y > 5)\n        cout << \"A\";\n    else\n        cout << \"B\";\ncout << \"C\";", "stdin": null, "options": ["A", "C", "BC", "B"], "answer": 1, "why_en": "The `else` belongs to the inner `if`. The outer test `x > 5` is false, so nothing inside runs; only C prints.", "why_ar": "الـ `else` تتبع الـ `if` الداخلية. الشرط الخارجي `x > 5` خاطئ فلا يعمل شيء بداخله، وتُطبع C فقط.", "mono": true, "id": "sec-11-q0", "n": 7, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:2", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "An `else` belongs to the nearest `if`, whatever the indentation looks like (the dangling else).", "idea_ar": "الـ `else` تتبع أقرب `if` مهما كانت المسافات البادئة (dangling else)."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int score = 85;\nif (score >= 50) cout << \"pass\";\nelse if (score >= 80) cout << \"good\";\nelse cout << \"fail\";", "stdin": null, "options": ["good", "pass", "fail", "pass good"], "answer": 1, "why_en": "Only the first true branch runs.", "why_ar": "يعمل أول فرع صحيح فقط.", "mono": true, "id": "sec-11-q1", "n": 8, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:1", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "In an if / else if chain only the first true branch runs, so put the strictest test first.", "idea_ar": "في سلسلة if / else if يعمل أول فرع صحيح فقط، لذلك ضع الشرط الأشد أولاً."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int n = 3;\nswitch (n) {\n    case 1: cout << \"A\";\n    case 3: cout << \"B\";\n    case 4: cout << \"C\"; break;\n    case 5: cout << \"D\";\n    default: cout << \"E\";\n}", "stdin": null, "options": ["B", "BC", "BCDE", "C"], "answer": 1, "why_en": "It jumps to `case 3`, prints B, falls through to `case 4`, prints C, and then `break` stops it.", "why_ar": "يقفز إلى `case 3` فيطبع B ثم يكمل إلى `case 4` فيطبع C ثم `break` توقفه.", "mono": true, "id": "sec-11-q2", "n": 9, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:5", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "Without `break` execution falls through into the next case. Stacked labels share one statement.", "idea_ar": "بدون `break` يستمر التنفيذ إلى الـ case التالية. والـ labels المتتابعة تشترك في جملة واحدة."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "char g = 'B';\nswitch (g) {\n    case 'A': cout << \"Excellent\"; break;\n    case 'B':\n    case 'C': cout << \"Good\"; break;\n    default: cout << \"Unknown\";\n}", "stdin": null, "options": ["Good", "GoodUnknown", "Excellent", "Unknown"], "answer": 0, "why_en": "`case 'B'` has no statement of its own, so it falls into `case 'C'` and prints Good; then `break`.", "why_ar": "الـ `case 'B'` ليس لها جملة خاصة فتسقط إلى `case 'C'` وتطبع Good ثم `break`.", "mono": true, "id": "sec-11-q3", "n": 10, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:5", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "Without `break` execution falls through into the next case. Stacked labels share one statement.", "idea_ar": "بدون `break` يستمر التنفيذ إلى الـ case التالية. والـ labels المتتابعة تشترك في جملة واحدة."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int a = 7;\ncout << (a % 2 == 0 ? \"even\" : \"odd\");", "stdin": null, "options": ["0", "odd", "1", "even"], "answer": 1, "why_en": "7 % 2 is 1, so the test is false and the second value, `odd`, is chosen.", "why_ar": "‏7 % 2 تساوي 1 فالشرط خاطئ وتُختار القيمة الثانية `odd`.", "mono": true, "id": "sec-11-q4", "n": 11, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:3", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "`cond ? a : b` gives a when the condition is true, otherwise b.", "idea_ar": "‏`cond ? a : b` تعطي a إذا كان الشرط صحيحاً وإلا فتعطي b."}, {"stem_en": "Which of these can NOT be the expression of a `switch`?", "stem_ar": "أي مما يلي لا يمكن أن يكون تعبير الـ `switch`؟", "code": null, "stdin": null, "options": ["An int variable", "A double variable", "A char variable", "An int expression such as n % 3"], "answer": 1, "why_en": "`switch` works only with integral types (int, char, bool, enum).", "why_ar": "الـ `switch` تعمل فقط مع الأنواع integral (‏int و char و bool و enum).", "mono": false, "id": "sec-11-q5", "n": 12, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:4", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "`switch` works on int, char, bool and enum, not on double or string. Every `case` label must be a constant.", "idea_ar": "الـ `switch` تعمل مع int و char و bool و enum وليس double أو string. وكل `case` يجب أن تكون ثابتاً."}, {"stem_en": "What happens when `assert(x > 0);` runs with x = -1?", "stem_ar": "ماذا يحدث عند تنفيذ `assert(x > 0);` عندما x = -1؟", "code": null, "stdin": null, "options": ["The program stops and prints an error message", "x is set to 1", "The compiler reports an error", "The program continues silently"], "answer": 0, "why_en": "A failed assert aborts the program at run time.", "why_ar": "الـ assert الفاشلة توقف البرنامج أثناء التشغيل.", "mono": false, "id": "sec-11-q6", "n": 13, "tag": "4.2 · if, else, switch and assert", "ref": "sec-11:6", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "`assert(cond)` stops the program with an error message when `cond` is false, and does nothing when it is true.", "idea_ar": "الدالة `assert(cond)` توقف البرنامج مع رسالة خطأ عندما يكون `cond` خاطئاً، ولا تفعل شيئاً عندما يكون صحيحاً."}], "quiz_secs": ["sec-10", "sec-11"]}, {"id": "ch-5", "kicker": "Final review", "title_en": "All chapters together", "title_ar": "كل الفصول معاً", "intro_en": "Mixed questions from every chapter, plus the trap checklist. A wrong answer sends you back to the right explanation.", "intro_ar": "أسئلة مختلطة من كل الفصول مع قائمة الفخاخ. الإجابة الخاطئة تأخذك إلى الشرح المناسب.", "sections": [{"id": "sec-12", "num": "R", "title_en": "Mixed review and exam traps", "title_ar": "مراجعة شاملة وفخاخ الامتحان", "blocks": [{"t": "p", "en": "Do this part last. First read the checklist, then answer the mixed questions without looking back.", "ar": "اجعل هذا القسم الأخير. اقرأ القائمة أولاً ثم أجب عن الأسئلة المختلطة دون الرجوع للشرح."}, {"t": "list", "ordered": false, "en": ["`int / int` is an `int`. Check the type on both sides of every `/`.", "`%` is integers only; the sign follows the left operand.", "Assigning a double to an int truncates; conversion happens after the calculation.", "A `char` in arithmetic is a number: `'A' + 1` is 66.", "`x++` returns the old value, `++x` the new one.", "`cout` prints 6 significant digits and drops `.0`; `fixed` + `setprecision` counts decimals.", "`cin >> x` then `getline` needs `cin.ignore()`.", "`toupper` returns an int. Any non-zero value is true.", "`=` is not `==`; a stray `;` after `if` is an empty statement; `else` binds to the nearest `if`.", "`&&` is stronger than `||`, and both short-circuit.", "`switch` without `break` falls through; the switch expression must be integral."], "ar": ["‏`int / int` ناتجه `int`. افحص نوع الطرفين عند كل `/`.", "‏`%` للأعداد الصحيحة فقط؛ والإشارة تتبع الطرف الأيسر.", "إسناد double إلى int يقطع الكسر؛ والتحويل يحدث بعد الحساب.", "الـ `char` في الحساب رقم: ‏`'A' + 1` تساوي 66.", "‏`x++` ترجع القيمة القديمة و`++x` الجديدة.", "الـ `cout` يطبع 6 أرقام معنوية ويحذف `.0`؛ و`fixed` مع `setprecision` تعدّ الخانات العشرية.", "‏`cin >> x` ثم `getline` تحتاج `cin.ignore()`.", "‏`toupper` ترجع int. وأي قيمة غير صفرية تعني true.", "‏`=` ليست `==`؛ والفاصلة الزائدة بعد `if` جملة فارغة؛ والـ `else` ترتبط بأقرب `if`.", "‏`&&` أقوى من `||`، وكلاهما يقوم بـ short-circuit.", "الـ `switch` بدون `break` تكمل للـ case التالية؛ وتعبيرها يجب أن يكون integral."]}]}], "quiz": [{"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "double r = 9 / 2 + 9 / 2.0;\ncout << r;", "stdin": null, "options": ["8", "4.5", "8.5", "9"], "answer": 2, "why_en": "9 / 2 = 4 (int division) and 9 / 2.0 = 4.5, so the sum is 8.5.", "why_ar": "‏9 / 2 = 4 (قسمة صحيحة) و 9 / 2.0 = 4.5 فالمجموع 8.5.", "mono": true, "id": "sec-12-q0", "n": 1, "tag": "R · Mixed review and exam traps", "ref": "sec-4:0", "ref_label": "2.3 · Arithmetic, integer division and precedence", "idea_en": "int ÷ int gives an int (the fraction is dropped). If either side is a double, the result is a double.", "idea_ar": "قسمة int على int تعطي int (يُحذف الكسر). وإذا كان أحد الطرفين double فالناتج double."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int a = 3, b = 4;\nint c = a++ * 2 + --b;\ncout << a << \" \" << b << \" \" << c;", "stdin": null, "options": ["4 4 10", "3 3 9", "4 3 9", "4 3 10"], "answer": 2, "why_en": "`a++` uses 3 then a becomes 4; `--b` makes b 3 and uses 3. c = 3 * 2 + 3 = 9.", "why_ar": "‏`a++` تستخدم 3 ثم يصبح a ‏4؛ و`--b` تجعل b ‏3 وتستخدم 3. إذن c = 3 * 2 + 3 = 9.", "mono": true, "id": "sec-12-q1", "n": 2, "tag": "R · Mixed review and exam traps", "ref": "sec-6:0", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`x++` gives the old value, then adds 1. `++x` adds 1, then gives the new value. `x op= y` means `x = x op (y)`.", "idea_ar": "`x++` تعطي القيمة القديمة ثم تزيد 1. و`++x` تزيد 1 ثم تعطي القيمة الجديدة. و`x op= y` تعني `x = x op (y)`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << \"x\" << 1 + 2 << \"y\" << '3' + 1;", "stdin": null, "options": ["x3y3+1", "x3y52", "x12y4", "x3y4"], "answer": 1, "why_en": "`1 + 2` = 3. `'3' + 1` is 51 + 1 = 52, an int.", "why_ar": "‏`1 + 2` = 3. و`'3' + 1` تساوي 51 + 1 = 52 وهي int.", "mono": true, "id": "sec-12-q2", "n": 3, "tag": "R · Mixed review and exam traps", "ref": "sec-5:2", "ref_label": "2.4 · Casting and the char type", "idea_en": "In arithmetic a char is its ASCII number: `'A' + 1` is 66. Use `char(...)` to turn a number back into a letter. A digit character minus `'0'` gives the digit.", "idea_ar": "في الحساب يُعامل الـ char كرقم ASCII الخاص به: `'A' + 1` تساوي 66. استخدم `char(...)` لإرجاع الرقم إلى حرف. وطرح `'0'` من حرف رقم يعطي الرقم نفسه."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << fixed << setprecision(1) << 2.0 << \" \" << 7 / 2 << \" \" << 7 / 2.0;", "stdin": null, "options": ["2.0 3 3.5", "2 3 3.5", "2.0 3.5 3.5", "2.0 3 3"], "answer": 0, "why_en": "`fixed` shows 2.0. `7 / 2` is the int 3, which ignores `fixed`. `7 / 2.0` is 3.5.", "why_ar": "‏`fixed` تُظهر 2.0. و`7 / 2` هي العدد 3 (int) فتتجاهل `fixed`. و`7 / 2.0` تساوي 3.5.", "mono": true, "id": "sec-12-q3", "n": 4, "tag": "R · Mixed review and exam traps", "ref": "sec-7:4", "ref_label": "3.1 · Output: cout and formatting", "idea_en": "`fixed` with `setprecision(n)` gives n decimals. `setprecision(n)` alone gives n significant digits in total. `setw(n)` pads only the next item, right-aligned. `boolalpha` prints true/false.", "idea_ar": "‏`fixed` مع `setprecision(n)` تعطي n خانة عشرية. و`setprecision(n)` وحدها تعطي n رقماً معنوياً بالمجموع. و`setw(n)` تملأ العنصر التالي فقط ومحاذاته لليمين. و`boolalpha` تطبع true/false."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int x; string s;\ncin >> x;\ngetline(cin, s);\ncout << x << \"|\" << s << \"|\";", "stdin": "42 hello world\n", "options": ["42|hello world|", "42| hello world|", "42||", "42|hello|"], "answer": 1, "why_en": "`getline` starts right after `42`, so the leading space is kept in the text.", "why_ar": "الـ `getline` تبدأ بعد `42` مباشرة، فتبقى المسافة الأولى داخل النص.", "mono": true, "id": "sec-12-q4", "n": 5, "tag": "R · Mixed review and exam traps", "ref": "sec-8:4", "ref_label": "3.2 · Input: cin and getline", "idea_en": "After `cin >> number` the newline stays in the buffer, so the next `getline` reads that empty rest. `cin.ignore()` throws it away first.", "idea_ar": "بعد `cin >> number` يبقى الـ newline في الـ buffer فتقرأ الـ `getline` التالية هذا الباقي الفارغ. الـ `cin.ignore()` تتخلص منه أولاً."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int n = 2;\nswitch (n) {\n    case 1: cout << \"A\";\n    case 2: cout << \"B\";\n    case 3: cout << \"C\"; break;\n    default: cout << \"D\";\n}", "stdin": null, "options": ["C", "BCD", "B", "BC"], "answer": 3, "why_en": "It enters at `case 2`, falls through to `case 3`, and `break` stops before `default`.", "why_ar": "يدخل عند `case 2` ويكمل إلى `case 3` ثم `break` توقفه قبل `default`.", "mono": true, "id": "sec-12-q5", "n": 6, "tag": "R · Mixed review and exam traps", "ref": "sec-11:5", "ref_label": "4.2 · if, else, switch and assert", "idea_en": "Without `break` execution falls through into the next case. Stacked labels share one statement.", "idea_ar": "بدون `break` يستمر التنفيذ إلى الـ case التالية. والـ labels المتتابعة تشترك في جملة واحدة."}], "quiz_secs": ["sec-12"]}]}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var CH = DATA.chapters;
  var KEY = 'cpp-primer-v2';
  var state = { bi: false, ans: {}, ch: 'ch-1' };
  try { var sv = localStorage.getItem(KEY); if (sv) { var p = JSON.parse(sv); state.bi = !!p.bi; state.ans = p.ans || {}; state.ch = p.ch || 'ch-1'; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function fmt(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }
  function row(en, ar) { return '<div class="row"><div class="en">' + en + '</div><div class="ar" lang="ar" dir="rtl">' + ar + '</div></div>'; }
  function listHTML(items, ordered) { var t = ordered ? 'ol' : 'ul'; return '<' + t + '>' + items.map(function (i) { return '<li>' + fmt(i) + '</li>'; }).join('') + '</' + t + '>'; }
  function tableHTML(t) {
    return '<div class="tbl"><table><thead><tr>' + t.head.map(function (h) { return '<th>' + fmt(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      t.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + fmt(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function codeHTML(code, stdin, out, withOut) {
    var s = '<figure class="code"><div class="code-head"><span>C++</span></div><pre><code>' + esc(code) + '</code></pre>';
    if (stdin !== null && stdin !== undefined) s += '<div class="stdin"><b>Input</b>' + esc(stdin.replace(/\n/g, '⏎')) + '</div>';
    if (withOut) s += '<div class="out"><div class="code-head"><span>Output</span></div><pre>' + esc(out) + '</pre></div>';
    return s + '</figure>';
  }
  function blockHTML(b) {
    if (b.t === 'p') return row('<p>' + fmt(b.en) + '</p>', '<p>' + fmt(b.ar) + '</p>');
    if (b.t === 'list') return row(listHTML(b.en, b.ordered), listHTML(b.ar, b.ordered));
    if (b.t === 'table') return row(tableHTML(b.en), tableHTML(b.ar));
    if (b.t === 'trap') return row('<div class="trap"><span class="chip">Exam trap</span><p>' + fmt(b.en) + '</p></div>', '<div class="trap"><span class="chip">فخ في الامتحان</span><p>' + fmt(b.ar) + '</p></div>');
    if (b.t === 'code') { var s = codeHTML(b.code, b.stdin, b.out, true); if (b.en) s += row('<p>' + fmt(b.en) + '</p>', '<p>' + fmt(b.ar) + '</p>'); return s; }
    return '';
  }

  var LET = ['A', 'B', 'C', 'D', 'E'];
  function fbHTML(q, a) {
    var ok = a === q.answer;
    var h = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><div class="verdict">' + (ok ? 'Correct' : 'Not quite. The answer is ' + LET[q.answer] + '.') + '</div>';
    h += row('<p>' + fmt(q.why_en) + '</p>', '<p>' + (ok ? '' : 'ليس تماماً. الجواب الصحيح هو ' + LET[q.answer] + '. ') + fmt(q.why_ar) + '</p>');
    if (!ok) {
      h += '<div class="idea"><span class="chip">The idea in short</span>' +
        row('<p>' + fmt(q.idea_en) + '</p>', '<p>' + fmt(q.idea_ar) + '</p>') + '</div>';
    }
    h += '<button type="button" class="btn jump' + (ok ? ' ghost' : '') + '" data-ref="' + q.ref + '" data-q="' + q.id + '">' +
      (ok ? 'Review the explanation' : 'Still unclear? Open the full explanation') + ' · ' + esc(q.ref_label) + ' ↑</button></div>';
    return h;
  }
  function qHTML(ch, q) {
    var a = state.ans[q.id], done = (a !== undefined && a !== null);
    var h = '<div class="q" id="q-' + q.id + '"><div class="q-top"><span class="q-n">QUESTION ' + q.n + ' / ' + ch.quiz.length + '</span><span class="q-tag">' + esc(q.tag) + '</span></div>';
    h += row('<p>' + fmt(q.stem_en) + '</p>', '<p>' + fmt(q.stem_ar) + '</p>');
    if (q.code) h += codeHTML(q.code, q.stdin, '', false);
    h += '<div class="opts" role="group" aria-label="Answer options">';
    q.options.forEach(function (o, k) {
      var c = 'opt' + (q.mono ? ' mono' : '');
      if (done) { if (k === q.answer) c += ' right'; else if (k === a) c += ' wrong'; }
      h += '<button type="button" class="' + c + '" data-q="' + q.id + '" data-k="' + k + '"' + (done ? ' disabled' : '') + '><span class="l">' + LET[k] + '</span><span class="t">' + esc(o) + '</span></button>';
    });
    h += '</div>';
    if (done) h += fbHTML(q, a);
    return h + '</div>';
  }
  function chapterHTML(ch, ci) {
    var h = '<article class="chapter" id="' + ch.id + '" hidden>';
    h += '<header class="ch-h"><p class="ch-k">' + esc(ch.kicker) + '</p><h1>' + esc(ch.title_en) + '</h1><p class="ar-title" lang="ar" dir="rtl">' + esc(ch.title_ar) + '</p>' +
      '<div class="ch-intro">' + row('<p>' + esc(ch.intro_en) + '</p>', '<p>' + esc(ch.intro_ar) + '</p>') + '</div></header>';
    h += '<div class="chnav" aria-label="In this chapter">' + ch.sections.map(function (s) { return '<a href="#' + s.id + '"><b>' + esc(s.num) + '</b>' + esc(s.title_en) + '</a>'; }).join('') +
      '<a class="q" href="#quiz-' + ch.id + '"><b>?</b>Quiz</a></div>';
    ch.sections.forEach(function (s) {
      h += '<section class="sec" id="' + s.id + '"><header class="sec-h"><span class="sec-n">' + esc(s.num) + '</span><div class="sec-t"><h2>' + esc(s.title_en) + '</h2><p class="ar-title" lang="ar" dir="rtl">' + esc(s.title_ar) + '</p></div></header>';
      s.blocks.forEach(function (b, i) { h += '<div class="blk" id="blk-' + s.id + '-' + i + '">' + blockHTML(b) + '</div>'; });
      h += '</section>';
    });
    h += '<section class="quiz" id="quiz-' + ch.id + '"><div class="quiz-h"><h2>' + (ch.id === 'ch-5' ? 'Final quiz' : 'Chapter quiz') + '</h2><span class="score" id="score-' + ch.id + '"></span>' +
      '<button type="button" class="btn ghost retry" data-ch="' + ch.id + '">Retry this quiz</button></div>' +
      '<p class="quiz-sub">Answer from memory first. If you miss one, you get a short explanation of the idea, and a button that takes you to the full explanation above.</p>' +
      '<div id="qs-' + ch.id + '">' + ch.quiz.map(function (q) { return qHTML(ch, q); }).join('') + '</div></section>';
    h += '<div class="chfoot">' + (ci > 0 ? '<a class="btn ghost" href="#' + CH[ci - 1].id + '">← ' + esc(CH[ci - 1].kicker) + ': ' + esc(CH[ci - 1].title_en) + '</a>' : '<span></span>') +
      (ci < CH.length - 1 ? '<a class="btn solid" href="#' + CH[ci + 1].id + '">Next: ' + esc(CH[ci + 1].kicker) + ' → ' + esc(CH[ci + 1].title_en) + '</a>' : '') + '</div>';
    return h + '</article>';
  }

  var main = document.getElementById('main'), nav = document.getElementById('nav');
  main.innerHTML =
    '<div class="intro"><p><b>How to use this page.</b> Pick a chapter. Read its explanation in English. If a sentence is hard, press <b>العربية</b> at the top to show the Arabic translation beside it. At the end of the chapter, answer the quiz. A wrong answer shows the idea in a few lines, and a button that jumps to the full explanation for that exact question.</p>' +
    '<p class="note">Based on Malik chapters 1–4 and standard C++. Every program output here was produced by running the code with g++. Check your own slides for anything your instructor adds.</p>' +
    '<p class="ar-intro" lang="ar" dir="rtl">اختر فصلاً واقرأ شرحه بالإنجليزية. وإذا صعبت عليك جملة فاضغط «العربية» في الأعلى لتظهر الترجمة بجانبها. في نهاية الفصل أجب عن الأسئلة. الإجابة الخاطئة تعرض الفكرة باختصار مع زر يأخذك إلى الشرح الكامل الخاص بهذا السؤال.</p></div>' +
    CH.map(chapterHTML).join('') +
    '<p class="foot">Your answers are saved in this browser only.</p>';

  nav.innerHTML = '<h2>Chapters</h2><ol>' + CH.map(function (c) {
    return '<li class="chi" data-ch="' + c.id + '"><a href="#' + c.id + '"><span class="nn">' + (c.id === 'ch-5' ? 'R' : c.id.slice(3)) + '</span><span class="nt">' + esc(c.title_en) + '</span><span class="ns" id="ns-' + c.id + '"></span></a>' +
      '<ol class="subs">' + c.sections.map(function (s) { return '<li><a href="#' + s.id + '" data-nav="' + s.id + '"><span class="nn">' + esc(s.num) + '</span><span class="nt">' + esc(s.title_en) + '</span></a></li>'; }).join('') +
      '<li><a href="#quiz-' + c.id + '" data-nav="quiz-' + c.id + '"><span class="nn">?</span><span class="nt">' + (c.id === 'ch-5' ? 'Final quiz' : 'Chapter quiz') + '</span></a></li></ol></li>';
  }).join('') + '</ol>';

  var qIdx = {};
  CH.forEach(function (c) { c.quiz.forEach(function (q) { qIdx[q.id] = { ch: c, q: q }; }); });

  function stats() {
    var total = 0, answered = 0, correct = 0;
    CH.forEach(function (c) {
      var sa = 0, sc = 0, n = c.quiz.length;
      c.quiz.forEach(function (q) { var a = state.ans[q.id]; if (a !== undefined && a !== null) { sa++; if (a === q.answer) sc++; } });
      total += n; answered += sa; correct += sc;
      var el = document.getElementById('score-' + c.id), ns = document.getElementById('ns-' + c.id);
      if (el) el.textContent = sa === n ? 'Score: ' + sc + ' / ' + n : sa + ' of ' + n + ' answered';
      if (ns) { ns.textContent = sa === n ? '✓ ' + sc + '/' + n : (sa ? sa + '/' + n : ''); ns.className = 'ns' + (sa === n ? ' done' : ''); }
    });
    document.getElementById('prog').innerHTML = '<span class="p-long"><b>' + answered + '</b> / ' + total + ' answered · <b>' + correct + '</b> correct</span><span class="p-short"><b>' + answered + '</b>/' + total + ' · ✓ <b>' + correct + '</b></span>';
    document.getElementById('barfill').style.width = (total ? Math.round(100 * answered / total) : 0) + '%';
  }
  function applyBi() {
    main.classList.toggle('bi', state.bi);
    document.getElementById('gtr').setAttribute('aria-pressed', String(state.bi));
  }
  var current = null;
  function showChapter(id) {
    CH.forEach(function (c) { document.getElementById(c.id).hidden = (c.id !== id); });
    [].forEach.call(nav.querySelectorAll('.chi'), function (li) { li.classList.toggle('cur', li.getAttribute('data-ch') === id); });
    current = id; state.ch = id; save();
    var cur = nav.querySelector('.chi.cur > a'), ol = nav.querySelector('ol');
    if (cur && ol && ol.scrollWidth > ol.clientWidth) ol.scrollLeft = Math.max(0, cur.offsetLeft - 16);
  }
  function instantScroll(el, block) {
    var root = document.documentElement, prev = root.style.scrollBehavior;
    root.style.scrollBehavior = 'auto';
    el.scrollIntoView({ block: block });
    root.style.scrollBehavior = prev;
  }
  function hideBack() { document.getElementById('back').hidden = true; returnTo = null; }
  var returnTo = null;

  function route() {
    var h = decodeURIComponent((location.hash || '').slice(1));
    var el = h ? document.getElementById(h) : null;
    hideBack();
    if (!el) { showChapter(CH.some(function (c) { return c.id === state.ch; }) ? state.ch : 'ch-1'); if (h === '') window.scrollTo(0, 0); return; }
    var chEl = el.classList.contains('chapter') ? el : el.closest('.chapter');
    if (!chEl) return;
    showChapter(chEl.id);
    if (el === chEl) window.scrollTo(0, 0); else el.scrollIntoView({ block: 'start' });
  }
  window.addEventListener('hashchange', route);

  function jump(ref, qid) {
    var m = ref.split(':'), el = document.getElementById('blk-' + m[0] + '-' + m[1]);
    if (!el) return;
    var chEl = el.closest('.chapter');
    if (chEl.id !== current) showChapter(chEl.id);
    returnTo = qid;
    document.getElementById('back').hidden = false;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    instantScroll(el, 'center');
    setTimeout(function () { el.classList.remove('flash'); }, 3000);
  }
  function goBack() {
    if (!returnTo) return;
    var info = qIdx[returnTo], qid = returnTo;
    if (info.ch.id !== current) showChapter(info.ch.id);
    hideBack();
    var el = document.getElementById('q-' + qid);
    if (el) instantScroll(el, 'center');
  }

  document.addEventListener('click', function (e) {
    var t = e.target; if (!t.closest) return;
    var opt = t.closest('.opt');
    if (opt && !opt.disabled) {
      var id = opt.getAttribute('data-q'), k = parseInt(opt.getAttribute('data-k'), 10), info = qIdx[id];
      state.ans[id] = k; save();
      document.getElementById('q-' + id).outerHTML = qHTML(info.ch, info.q);
      stats(); return;
    }
    var jb = t.closest('.jump');
    if (jb) { jump(jb.getAttribute('data-ref'), jb.getAttribute('data-q')); return; }
    if (t.closest('#back')) { goBack(); return; }
    var rt = t.closest('.retry');
    if (rt) {
      var c = CH.filter(function (x) { return x.id === rt.getAttribute('data-ch'); })[0];
      c.quiz.forEach(function (q) { delete state.ans[q.id]; }); save();
      document.getElementById('qs-' + c.id).innerHTML = c.quiz.map(function (q) { return qHTML(c, q); }).join('');
      stats(); hideBack();
      document.getElementById('quiz-' + c.id).scrollIntoView({ block: 'start' });
      return;
    }
    if (t.closest('#gtr')) { state.bi = !state.bi; save(); applyBi(); }
  });

  applyBi(); stats(); route();

  try {
    var links = {};
    [].forEach.call(nav.querySelectorAll('a[data-nav]'), function (a) { links[a.getAttribute('data-nav')] = a; });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.remove('on'); });
          var l = links[en.target.id]; if (l) l.classList.add('on');
        }
      });
    }, { rootMargin: '-90px 0px -65% 0px', threshold: 0 });
    [].forEach.call(document.querySelectorAll('.sec, .quiz'), function (s) { io.observe(s); });
  } catch (e) {}
})();
</script>

</body>
</html>
