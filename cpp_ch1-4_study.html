<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15202a" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>C++ Ch1–4 Primer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: chapter list on the left; one chapter at a time on the right.
   A chapter reads top to bottom: explanation sections, then the chapter quiz.
   A wrong answer shows a short idea card and a button that jumps back to the explanation. */
:root {
  --bg: #f4f7f8;
  --surface: #ffffff;
  --surface2: #eaf0f3;
  --fg: #14202a;
  --muted: #566774;
  --line: #d3dde3;
  --accent: #0a6f8f;
  --accent-ink: #ffffff;
  --accent-soft: #dcedf3;
  --good: #14703a;
  --good-bg: #e0f3e7;
  --bad: #a3262a;
  --bad-bg: #fae4e4;
  --warn: #7c4a00;
  --warn-bg: #fff0d1;
  --code-bg: #12202b;
  --code-fg: #e6eef3;
  --code-muted: #8fa5b4;
  --out-bg: #0a141c;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --f-ar: "Noto Naskh Arabic", "Segoe UI", Tahoma, "Geeza Pro", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151b; --surface: #15202a; --surface2: #1b2a35; --fg: #e4ecf1; --muted: #92a5b2; --line: #2a3b47;
    --accent: #55c3e2; --accent-ink: #052029; --accent-soft: #12333e;
    --good: #72d69d; --good-bg: #12301f; --bad: #ff9094; --bad-bg: #3a1719; --warn: #f2b65f; --warn-bg: #35270f;
    --code-bg: #0b141b; --code-fg: #e6eef3; --code-muted: #8fa5b4; --out-bg: #060d12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151b; --surface: #15202a; --surface2: #1b2a35; --fg: #e4ecf1; --muted: #92a5b2; --line: #2a3b47;
  --accent: #55c3e2; --accent-ink: #052029; --accent-soft: #12333e;
  --good: #72d69d; --good-bg: #12301f; --bad: #ff9094; --bad-bg: #3a1719; --warn: #f2b65f; --warn-bg: #35270f;
  --code-bg: #0b141b; --code-fg: #e6eef3; --code-muted: #8fa5b4; --out-bg: #060d12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
:root { --hdr: 64px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.65 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent); }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--f-mono); font-size: 0.88em; background: var(--surface2); padding: 0.1em 0.38em; border-radius: 4px; direction: ltr; unicode-bidi: isolate; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.brand { font: 700 1.1rem/1.2 var(--f-head); letter-spacing: -0.01em; margin: 0; }
.brand small { display: block; font: 400 0.78rem var(--f-body); color: var(--muted); letter-spacing: 0; }
.spacer { flex: 1 1 auto; }
.prog { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog b { color: var(--fg); }
.p-short { display: none; }
.bar { width: 120px; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.btn {
  font: 600 0.88rem var(--f-body); color: var(--accent); background: var(--surface); border: 1.5px solid var(--accent);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; min-height: 38px; text-decoration: none; display: inline-block; text-align: start;
}
@media (hover: hover) { .btn:hover { background: var(--accent-soft); } }
.btn.arlbl { font-family: var(--f-ar); font-size: 0.95rem; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); color: var(--muted); font-weight: 500; }
.btn.solid { background: var(--accent); color: var(--accent-ink); }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; padding-block: 28px 100px; }
nav#nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 100px); overflow-y: auto; }
nav#nav h2 { font: 600 0.72rem var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
nav#nav ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav#nav a { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 8px; border-radius: 6px; text-decoration: none; color: var(--fg); font-size: 0.92rem; line-height: 1.35; }
nav#nav a:hover { background: var(--surface2); }
nav#nav .chi.cur > a { background: var(--accent-soft); font-weight: 600; }
nav#nav .subs { margin: 2px 0 8px 14px; padding-left: 8px; border-left: 2px solid var(--line); display: none; }
nav#nav .chi.cur .subs { display: grid; }
nav#nav .subs a { font-size: 0.84rem; color: var(--muted); padding: 4px 8px; grid-template-columns: 30px 1fr; }
nav#nav .subs a.on { color: var(--fg); background: var(--surface2); }
.nn { font: 600 0.78rem var(--f-mono); color: var(--muted); }
.ns { font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 400; }
.ns.done { color: var(--good); font-weight: 600; }

main { min-width: 0; }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 28px; }
.intro p { margin: 0 0 6px; max-width: 70ch; }
.intro .ar-intro { font-family: var(--f-ar); font-size: 1.08rem; color: var(--muted); direction: rtl; text-align: right; margin-top: 8px; }
.intro .note { font-size: 0.88rem; color: var(--muted); }
main:not(.bi) .ar-intro { display: none; }

.chnav { display: none; }
.chapter { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 12px); }
.ch-h { margin-bottom: 26px; }
.ch-k { font: 600 0.78rem var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin: 0 0 4px; }
.ch-h h1 { font: 700 2rem/1.15 var(--f-head); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.ar-title { display: none; margin: 4px 0 0; font: 600 1.2rem var(--f-ar); color: var(--muted); }
main.bi .ar-title { display: block; }
.ch-intro { margin: 10px 0 0; }

.sec { margin-bottom: 52px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 12px); }
.sec-h { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sec-n { font: 700 0.95rem var(--f-mono); min-width: 44px; padding: 5px 8px; text-align: center; border-radius: 8px; background: var(--accent); color: var(--accent-ink); }
.sec-t h2 { font: 700 1.4rem/1.25 var(--f-head); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.sec-t .ar-title { font-size: 1.1rem; }

.blk { border-radius: 10px; margin-inline: -8px; padding-inline: 8px; }
.blk.flash { animation: flash 2.8s ease-out 1; outline: 3px solid var(--accent); outline-offset: 4px; }
@keyframes flash { 0%, 55% { background: var(--accent-soft); } 100% { background: transparent; } }

.row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 36px; margin-bottom: 14px; }
.en, .ar { min-width: 0; max-width: 72ch; }
.en p, .ar p { margin: 0; }
.en ul, .en ol, .ar ul, .ar ol { margin: 0; padding-inline-start: 1.25em; display: grid; gap: 6px; }
.ar { font-family: var(--f-ar); font-size: 1.12rem; line-height: 1.85; }
.ar code { font-size: 0.8em; }
main:not(.bi) .ar { display: none; }
main.bi .ar { background: var(--surface2); border-radius: 8px; padding: 10px 14px; }
@media (min-width: 960px) {
  main.bi .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main.bi .en, main.bi .ar { max-width: none; }
  main.bi .ar { background: transparent; border-inline-start: 2px solid var(--line); padding: 0 18px 0 0; }
}

.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
.tbl th, .tbl td { text-align: start; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { background: var(--surface2); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.02em; }
.tbl tr:last-child td { border-bottom: 0; }
.ar .tbl table { font-family: var(--f-ar); font-size: 1rem; }

.code pre code { background: none; padding: 0; font-size: inherit; border-radius: 0; }
figure.code { margin: 4px 0 10px; border-radius: 10px; overflow: hidden; background: var(--code-bg); color: var(--code-fg); max-width: 100%; }
.code-head { display: flex; justify-content: space-between; gap: 12px; padding: 6px 14px; font: 500 0.7rem var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--code-muted); border-bottom: 1px solid rgba(255,255,255,.08); }
.code pre { margin: 0; padding: 12px 14px; overflow-x: auto; font: 400 0.88rem/1.6 var(--f-mono); tab-size: 4; }
.code .stdin { padding: 8px 14px; font: 400 0.85rem var(--f-mono); background: rgba(255,255,255,.05); color: var(--code-fg); border-top: 1px solid rgba(255,255,255,.08); }
.code .stdin b { color: var(--code-muted); font: 500 0.7rem var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; margin-inline-end: 10px; }
.code .out { background: var(--out-bg); border-top: 1px solid rgba(255,255,255,.08); }
.code .out pre { color: #9be3b4; }

.trap, .idea { border-radius: 10px; padding: 12px 16px; color: var(--fg); }
.trap { border: 1.5px solid var(--warn); background: var(--warn-bg); }
.chip { display: inline-block; font: 700 0.68rem var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
.trap .chip { color: var(--warn); }
.ar .chip { font-family: var(--f-ar); font-size: 0.9rem; letter-spacing: 0; text-transform: none; }
main.bi .ar:has(.trap) { background: transparent; padding: 0; }

.quiz { margin-top: 20px; border-top: 2px solid var(--fg); padding-top: 18px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 12px); }
.quiz-h { display: flex; align-items: baseline; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 6px; }
.quiz-h h2 { font: 700 1.5rem var(--f-head); margin: 0; letter-spacing: -0.015em; }
.quiz-h .score { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.quiz-sub { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 12px); }
.q-top { display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 8px; }
.q-n { font: 600 0.72rem var(--f-mono); letter-spacing: 0.06em; color: var(--muted); }
.q-tag { font-size: 0.75rem; color: var(--muted); }
.q .row { margin-bottom: 10px; }
.q figure.code { margin: 6px 0 12px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; margin-top: 4px; }
.opt {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; text-align: start;
  font: 400 0.95rem/1.45 var(--f-body); color: var(--fg); background: var(--bg); border: 1.5px solid var(--line);
  border-radius: 8px; padding: 9px 12px; cursor: pointer; min-height: 44px;
}
.opt .l { font: 600 0.8rem var(--f-mono); color: var(--muted); }
.opt .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.opt.mono .t { font-family: var(--f-mono); font-size: 0.88rem; }
@media (hover: hover) { .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); } }
.opt:active:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.right .l::after { content: " ✓"; color: var(--good); }
.opt.wrong .l::after { content: " ✗"; color: var(--bad); }
.fb { margin-top: 12px; border-radius: 10px; padding: 12px 14px; border: 1.5px solid var(--line); background: var(--surface2); display: grid; gap: 10px; }
.fb.ok { border-color: var(--good); }
.fb.no { border-color: var(--bad); }
.fb .verdict { font-weight: 600; }
.fb.ok .verdict { color: var(--good); }
.fb.no .verdict { color: var(--bad); }
.fb .row { margin: 0; }
main.bi .fb .ar { background: transparent; padding: 0; border: 0; }
@media (min-width: 960px) { main.bi .fb .ar { border-inline-start: 2px solid var(--line); padding-inline-start: 14px; } }
.idea { background: var(--surface); border: 1px solid var(--line); }
.idea .chip { color: var(--accent); }
.jump { justify-self: start; }
.chfoot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }
.foot { margin-top: 22px; color: var(--muted); font-size: 0.85rem; max-width: 70ch; }

#back {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 25;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 6px 24px rgba(0,0,0,.28); font-size: 0.95rem; padding: 10px 18px; border-radius: 99px; white-space: nowrap;
}

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 16px 100px; }
  nav#nav { position: static; max-height: none; overflow: visible; }
  nav#nav ol { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  nav#nav .subs { display: none !important; }
  nav#nav a { display: flex; gap: 6px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line); padding: 6px 10px; }
  nav#nav .chi.cur > a { border-color: var(--accent); }
  nav#nav .nt { max-width: 18ch; overflow: hidden; text-overflow: ellipsis; }
  .bar { width: 80px; }
  .ch-h h1 { font-size: 1.6rem; }
  .sec-t h2 { font-size: 1.25rem; }
}
@media (max-width: 600px) {
  :root { --hdr: 52px; }
  .top { padding-block: 8px; }
  .top-in { flex-wrap: nowrap; gap: 10px; }
  .brand { font-size: 1rem; white-space: nowrap; }
  .brand small { display: none; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 3px; border-radius: 0; }
  .prog { white-space: nowrap; font-size: 0.8rem; }
  .p-long { display: none; }
  .p-short { display: inline; }
  .btn { min-height: 44px; padding: 8px 14px; }
  nav#nav a { min-height: 44px; align-items: center; }
  .chnav a { min-height: 44px; }
  #gtr { min-height: 40px; padding: 6px 12px; }
  .wrap { gap: 12px; padding-block: 12px 110px; }
  .intro { padding: 14px 16px; margin-bottom: 20px; }
  .ch-h h1 { font-size: 1.5rem; }
  .sec { margin-bottom: 40px; }
  .code pre { font-size: 0.8rem; padding: 10px 12px; }
  .q { padding: 14px; }
  .opt { padding: 11px 12px; min-height: 48px; }
  .fb { padding: 12px; }
  .jump { width: 100%; }
  .chfoot { flex-direction: column; }
  .chfoot .btn { width: 100%; }
  .chnav { display: flex; gap: 6px; overflow-x: auto; margin: -8px 0 22px; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .chnav a { flex: 0 0 auto; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; font-size: 0.85rem; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chnav a b { font: 600 0.75rem var(--f-mono); color: var(--muted); }
  .chnav a.q { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chnav a.q b { color: var(--accent-ink); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; } .bar > i { transition: none; } .blk.flash { animation: none; background: var(--accent-soft); }
}
</style>
</head>
<body>


<header class="top">
  <div class="top-in">
    <p class="brand">C++ Ch1–4 Primer<small>One chapter at a time: explanation, then questions</small></p>
    <span class="spacer"></span>
    <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
    <span class="prog" id="prog" aria-live="polite"></span>
    <button type="button" class="btn arlbl" id="gtr" aria-pressed="false" title="Show the Arabic translation beside the explanation">العربية</button>
  </div>
</header>

<div class="wrap">
  <nav id="nav" aria-label="Chapters"></nav>
  <main id="main"></main>
</div>

<script id="data" type="application/json">{"chapters": [{"id": "ch-1", "kicker": "Chapter 1", "title_en": "Computers and languages", "title_ar": "الكمبيوتر واللغات", "intro_en": "How a computer works and how C++ source code becomes a running program. Mostly definitions to remember.", "intro_ar": "كيف يعمل الكمبيوتر وكيف يتحول كود C++ إلى برنامج يعمل. معظمه تعريفات يجب حفظها.", "sections": [{"id": "sec-1", "num": "1.1", "title_en": "How a computer runs your program", "title_ar": "كيف يشغّل الكمبيوتر برنامجك", "blocks": [{"t": "p", "en": "A computer system has **hardware** (the physical parts) and **software** (the programs). Chapter 1 asks you to name the parts and say what each one does.", "ar": "يتكوّن الكمبيوتر من **hardware** (الأجزاء المادية) و**software** (البرامج). الشابتر الأول يطلب منك تسمية الأجزاء وذكر وظيفة كل جزء."}, {"t": "list", "ordered": false, "en": ["**CPU**: executes instructions. It contains the ALU (does the arithmetic and comparisons) and the control unit.", "**Main memory (RAM)**: fast but temporary. Its contents are lost when the power is off.", "**Secondary storage** (hard disk, SSD, USB): permanent storage for files and programs.", "**Input/output devices**: keyboard, mouse, screen, printer."], "ar": ["**CPU**: ينفّذ التعليمات. فيه الـ ALU (للحساب والمقارنات) ووحدة التحكم.", "**Main memory (RAM)**: سريعة لكنها مؤقتة. يضيع محتواها عند إطفاء الجهاز.", "**Secondary storage** (القرص الصلب، SSD، الفلاشة): تخزين دائم للملفات والبرامج.", "**أجهزة الإدخال والإخراج**: لوحة المفاتيح، الماوس، الشاشة، الطابعة."]}, {"t": "p", "en": "The computer only understands **binary**: a **bit** is a 0 or a 1, and a **byte** is 8 bits. Characters are stored as numbers using the **ASCII** table. Memory sizes grow by 1024 (1 KB = 1024 bytes).", "ar": "الكمبيوتر يفهم **النظام الثنائي (binary)** فقط: الـ **bit** هو 0 أو 1، والـ **byte** يساوي 8 bits. الحروف تُخزَّن كأرقام حسب جدول **ASCII**. وحدات الذاكرة تزيد بمقدار 1024 (1 KB = 1024 bytes)."}, {"t": "code", "code": "cout << bitset<8>(13) << endl;\ncout << bitset<8>(255) << endl;\ncout << int('A') << \" \" << int('a') << \" \" << int('0') << \" \" << int(' ') << endl;", "stdin": null, "out": "00001101\n11111111\n65 97 48 32", "en": "13 is `00001101` (8 + 4 + 1). Remember: `'A'` = 65, `'a'` = 97, `'0'` = 48, space = 32.", "ar": "العدد 13 هو `00001101` (8 + 4 + 1). احفظ: `'A'` = 65 و`'a'` = 97 و`'0'` = 48 والمسافة = 32."}, {"t": "p", "en": "There are three levels of language. **Machine language** is pure 0s and 1s. **Assembly language** uses short symbols and is translated by an assembler. A **high-level language** such as C++ looks like English and is translated by a **compiler**. A compiler translates the whole program before it runs. An interpreter translates and runs one line at a time. C++ is compiled.", "ar": "هناك ثلاثة مستويات للغات. **Machine language** أصفار وواحدات فقط. **Assembly** رموز قصيرة يترجمها الـ assembler. **High-level language** مثل C++ تشبه الإنجليزية ويترجمها الـ **compiler**. الـ compiler يترجم البرنامج كاملاً قبل التشغيل، أما الـ interpreter فيترجم وينفّذ سطراً بسطر. لغة C++ مترجَمة (compiled)."}, {"t": "p", "en": "Steps to process a C++ program, in order:", "ar": "مراحل معالجة برنامج C++ بالترتيب:"}, {"t": "list", "ordered": true, "en": ["**Editor**: you write the source code (`.cpp`).", "**Preprocessor**: handles lines that start with `#`, such as `#include`.", "**Compiler**: checks syntax and produces object code.", "**Linker**: combines object code with library code into an executable.", "**Loader**: copies the program into memory.", "**Execution**: the CPU runs the instructions."], "ar": ["**Editor**: تكتب الكود المصدري (`.cpp`).", "**Preprocessor**: يعالج الأسطر التي تبدأ بـ `#` مثل `#include`.", "**Compiler**: يفحص القواعد (syntax) وينتج object code.", "**Linker**: يدمج الـ object code مع كود المكتبات في ملف تنفيذي.", "**Loader**: ينسخ البرنامج إلى الذاكرة.", "**Execution**: الـ CPU ينفّذ التعليمات."]}, {"t": "table", "en": {"head": ["Error type", "When it appears", "Example"], "rows": [["Syntax error", "At compile time; the compiler reports it", "Missing semicolon"], ["Runtime error", "While the program runs; it stops", "Integer division by zero"], ["Logic error", "Program runs but gives a wrong result; no message", "Using `+` instead of `*`"]]}, "ar": {"head": ["نوع الخطأ", "متى يظهر", "مثال"], "rows": [["Syntax error", "وقت الـ compile، والـ compiler يبلّغ عنه", "نسيان الفاصلة المنقوطة"], ["Runtime error", "أثناء تشغيل البرنامج، ويتوقف", "قسمة عدد صحيح على صفر"], ["Logic error", "البرنامج يعمل لكن النتيجة خاطئة، بدون رسالة", "استخدام `+` بدل `*`"]]}}, {"t": "p", "en": "Problem solving follows a cycle: **analyze** the problem, **design** an algorithm (a finite, ordered list of steps), **code** it, compile, then **test**. Two styles of programming appear in the chapter: **structured** programming (split the problem into functions) and **object-oriented** programming, OOP (build around objects).", "ar": "حل المشكلات يتبع دورة: **حلّل** المشكلة، **صمّم** خوارزمية (algorithm: خطوات محدودة ومرتبة)، **اكتب** الكود، ثم compile، ثم **اختبر**. يذكر الشابتر أسلوبين: البرمجة **المهيكلة (structured)** (تقسيم المشكلة إلى دوال) والبرمجة **كائنية التوجه (OOP)** (البناء حول objects)."}, {"t": "trap", "en": "The compiler can only find **syntax** errors. A logic error compiles and runs fine; you only notice it because the answer is wrong.", "ar": "الـ compiler يكتشف أخطاء الـ **syntax** فقط. أما الـ logic error فيُترجم ويعمل بشكل طبيعي، وتلاحظه فقط لأن الناتج خاطئ."}]}], "quiz": [{"stem_en": "Which stage combines your object code with library code to build the executable file?", "stem_ar": "أي مرحلة تدمج الـ object code مع كود المكتبات لبناء الملف التنفيذي؟", "code": null, "stdin": null, "options": ["Preprocessor", "Linker", "Loader", "Editor"], "answer": 1, "why_en": "The linker joins object code with libraries. The loader only copies the finished program into memory.", "why_ar": "الـ linker يدمج الـ object code مع المكتبات. أما الـ loader فينسخ البرنامج الجاهز إلى الذاكرة فقط.", "mono": false, "id": "sec-1-q0", "n": 1, "tag": "1.1 · How a computer runs your program", "ref": "sec-1:6", "ref_label": "1.1 · How a computer runs your program", "idea_en": "The order is: editor, preprocessor, compiler, linker, loader, execution. The linker is the one that builds the executable.", "idea_ar": "الترتيب: editor ثم preprocessor ثم compiler ثم linker ثم loader ثم التنفيذ. الـ linker هو الذي يبني الملف التنفيذي."}, {"stem_en": "You forget a semicolon. What kind of error is it, and who reports it?", "stem_ar": "نسيت فاصلة منقوطة. ما نوع الخطأ ومن يبلّغ عنه؟", "code": null, "stdin": null, "options": ["No error; C++ adds it for you", "Runtime error, reported by the linker", "Logic error, reported at run time", "Syntax error, reported by the compiler"], "answer": 3, "why_en": "A missing semicolon breaks the language rules, so the compiler refuses to continue.", "why_ar": "نسيان الفاصلة المنقوطة يخالف قواعد اللغة، فيرفض الـ compiler المتابعة.", "mono": false, "id": "sec-1-q1", "n": 2, "tag": "1.1 · How a computer runs your program", "ref": "sec-1:7", "ref_label": "1.1 · How a computer runs your program", "idea_en": "Syntax error: broken grammar, found by the compiler. Runtime error: crashes while running. Logic error: runs fine but the answer is wrong.", "idea_ar": "Syntax error: قواعد اللغة مكسورة ويكتشفه الـ compiler. Runtime error: يتوقف البرنامج أثناء التشغيل. Logic error: يعمل البرنامج لكن النتيجة خاطئة."}, {"stem_en": "A program should print 4 × 5 = 20 but prints 9 because it used `+`. What kind of error is this?", "stem_ar": "برنامج يجب أن يطبع 4 × 5 = 20 لكنه يطبع 9 لأنه استخدم `+`. ما نوع الخطأ؟", "code": null, "stdin": null, "options": ["Hardware error", "Syntax error", "Logic error", "Linker error"], "answer": 2, "why_en": "The code is legal, so it compiles and runs. The result is simply wrong: a logic error.", "why_ar": "الكود سليم قواعدياً فيُترجم ويعمل، لكن النتيجة خاطئة: هذا logic error.", "mono": false, "id": "sec-1-q2", "n": 3, "tag": "1.1 · How a computer runs your program", "ref": "sec-1:7", "ref_label": "1.1 · How a computer runs your program", "idea_en": "Syntax error: broken grammar, found by the compiler. Runtime error: crashes while running. Logic error: runs fine but the answer is wrong.", "idea_ar": "Syntax error: قواعد اللغة مكسورة ويكتشفه الـ compiler. Runtime error: يتوقف البرنامج أثناء التشغيل. Logic error: يعمل البرنامج لكن النتيجة خاطئة."}, {"stem_en": "What does this print?", "stem_ar": "ماذا يطبع هذا السطر؟", "code": "cout << bitset<8>(5);", "stdin": null, "options": ["00000110", "10100000", "00000100", "00000101"], "answer": 3, "why_en": "5 = 4 + 1, so the bits for 4 and 1 are set: 00000101.", "why_ar": "5 = 4 + 1 لذلك يُضبط bit الـ 4 وbit الـ 1: 00000101.", "mono": true, "id": "sec-1-q3", "n": 4, "tag": "1.1 · How a computer runs your program", "ref": "sec-1:3", "ref_label": "1.1 · How a computer runs your program", "idea_en": "Every bit is a power of two (… 8 4 2 1). 13 = 8 + 4 + 1 = 00001101. Characters are stored as numbers (ASCII).", "idea_ar": "كل bit يمثل قوة للعدد 2 (… 8 4 2 1). إذن 13 = 8 + 4 + 1 = 00001101. والحروف تُخزَّن كأرقام (ASCII)."}, {"stem_en": "Which memory loses its contents when the computer is switched off?", "stem_ar": "أي ذاكرة تفقد محتواها عند إطفاء الجهاز؟", "code": null, "stdin": null, "options": ["USB flash drive", "Hard disk", "Main memory (RAM)", "SSD"], "answer": 2, "why_en": "RAM is temporary. The other three are secondary (permanent) storage.", "why_ar": "الـ RAM مؤقتة. الثلاثة الباقية تخزين ثانوي (دائم).", "mono": false, "id": "sec-1-q4", "n": 5, "tag": "1.1 · How a computer runs your program", "ref": "sec-1:1", "ref_label": "1.1 · How a computer runs your program", "idea_en": "RAM is fast but temporary: it is emptied when the power goes off. Hard disk, SSD and USB are permanent storage.", "idea_ar": "الـ RAM سريعة لكنها مؤقتة: تُفرَّغ عند إطفاء الجهاز. أما القرص الصلب والـ SSD والفلاشة فتخزين دائم."}, {"stem_en": "Which statement about C++ is correct?", "stem_ar": "أي عبارة عن لغة C++ صحيحة؟", "code": null, "stdin": null, "options": ["It is translated only by an assembler", "A compiler translates the whole program before it runs", "It is interpreted one line at a time while running", "The CPU runs the source code directly"], "answer": 1, "why_en": "C++ is a compiled language: translate first, run later.", "why_ar": "C++ لغة مترجَمة: تُترجم أولاً ثم تُشغَّل.", "mono": false, "id": "sec-1-q5", "n": 6, "tag": "1.1 · How a computer runs your program", "ref": "sec-1:4", "ref_label": "1.1 · How a computer runs your program", "idea_en": "A compiler translates the whole program first, and only then does it run. C++ is a compiled language.", "idea_ar": "الـ compiler يترجم البرنامج كاملاً أولاً ثم يعمل. لغة C++ مترجَمة (compiled)."}], "quiz_secs": ["sec-1"]}, {"id": "ch-2", "kicker": "Chapter 2", "title_en": "C++ basics", "title_ar": "أساسيات C++", "intro_en": "Program structure, data types, arithmetic, casting and strings. Expect many output-tracing questions here.", "intro_ar": "تركيب البرنامج وأنواع البيانات والحساب والـ casting والنصوص. توقع هنا أسئلة كثيرة من نوع «ما الناتج؟».", "sections": [{"id": "sec-2", "num": "2.1", "title_en": "Anatomy of a C++ program", "title_ar": "تركيب برنامج C++", "blocks": [{"t": "p", "en": "Every program in this course starts from the same skeleton. Read it top to bottom.", "ar": "كل برنامج في المادة يبدأ من نفس الهيكل. اقرأه من الأعلى للأسفل."}, {"t": "code", "code": "#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello, C++!\" << endl;\n    return 0;\n}", "stdin": null, "out": "Hello, C++!", "en": "That is the whole program. `main` is where execution begins.", "ar": "هذا هو البرنامج كاملاً. الدالة `main` هي نقطة بداية التنفيذ."}, {"t": "list", "ordered": false, "en": ["`#include <iostream>` is a preprocessor directive that gives you `cout` and `cin`.", "`using namespace std;` lets you write `cout` instead of `std::cout`.", "`return 0;` tells the operating system the program finished successfully.", "Comments are ignored by the compiler: `// one line` and `/* many lines */`.", "Most statements end with a semicolon `;`."], "ar": ["`#include <iostream>` أمر للـ preprocessor يعطيك `cout` و`cin`.", "`using namespace std;` تتيح لك كتابة `cout` بدل `std::cout`.", "`return 0;` تخبر نظام التشغيل أن البرنامج انتهى بنجاح.", "التعليقات يتجاهلها الـ compiler: `// سطر واحد` و`/* عدة أسطر */`.", "معظم الجمل تنتهي بفاصلة منقوطة `;`."]}, {"t": "p", "en": "The smallest pieces of a program are **tokens**: special symbols (`+ - ; ,`), reserved words (`int`, `if`, `return`), and identifiers (names you invent). An **identifier** may contain letters, digits and `_`. It cannot start with a digit, cannot be a reserved word, and is **case-sensitive**.", "ar": "أصغر أجزاء البرنامج هي الـ **tokens**: رموز خاصة (`+ - ; ,`) وكلمات محجوزة (`int`, `if`, `return`) و identifiers (أسماء تخترعها أنت). الـ **identifier** يحتوي حروفاً وأرقاماً و`_`، ولا يبدأ برقم، ولا يكون كلمة محجوزة، وهو **حساس لحالة الأحرف (case-sensitive)**."}, {"t": "table", "en": {"head": ["Name", "Valid?", "Why"], "rows": [["`total_score`, `_x`, `Sum2`", "Yes", ""], ["`2ndPlace`", "No", "starts with a digit"], ["`first-name`", "No", "`-` is not allowed"], ["`int`", "No", "reserved word"], ["`my var`", "No", "contains a space"]]}, "ar": {"head": ["الاسم", "صالح؟", "السبب"], "rows": [["`total_score`, `_x`, `Sum2`", "نعم", ""], ["`2ndPlace`", "لا", "يبدأ برقم"], ["`first-name`", "لا", "الرمز `-` غير مسموح"], ["`int`", "لا", "كلمة محجوزة"], ["`my var`", "لا", "يحتوي مسافة"]]}}, {"t": "trap", "en": "`Total` and `total` are two different variables. Mixing them up gives a compile error (undeclared name).", "ar": "`Total` و`total` متغيّران مختلفان. الخلط بينهما يعطي compile error (اسم غير معرّف)."}]}, {"id": "sec-3", "num": "2.2", "title_en": "Data types: int vs double", "title_ar": "الأنواع: int مقابل double", "blocks": [{"t": "p", "en": "A data type decides what a variable can hold and how much memory it uses. These are the ones you need:", "ar": "نوع البيانات (data type) يحدد ما يمكن للمتغير تخزينه وكم ذاكرة يستخدم. هذه الأنواع المطلوبة:"}, {"t": "table", "en": {"head": ["Type", "Stores", "Typical size", "Example"], "rows": [["`int`", "whole numbers (no fraction)", "4 bytes", "`5`, `-3`"], ["`double`", "real numbers (with fraction)", "8 bytes, ~15 digits", "`3.14`, `2.0`"], ["`float`", "real numbers, less precise", "4 bytes, ~7 digits", "`3.14f`"], ["`char`", "one character (really its ASCII number)", "1 byte", "`'A'`"], ["`bool`", "`true` or `false`", "1 byte", "`true`"], ["`string`", "text (needs `<string>`)", "varies", "`\"Hello\"`"]]}, "ar": {"head": ["النوع", "يخزّن", "الحجم المعتاد", "مثال"], "rows": [["`int`", "أعداد صحيحة (بدون كسر)", "4 bytes", "`5`, `-3`"], ["`double`", "أعداد حقيقية (مع كسر)", "8 bytes، حوالي 15 رقماً", "`3.14`, `2.0`"], ["`float`", "أعداد حقيقية بدقة أقل", "4 bytes، حوالي 7 أرقام", "`3.14f`"], ["`char`", "حرف واحد (فعلياً رقم ASCII الخاص به)", "1 byte", "`'A'`"], ["`bool`", "`true` أو `false`", "1 byte", "`true`"], ["`string`", "نص (يحتاج `<string>`)", "يختلف", "`\"Hello\"`"]]}}, {"t": "code", "code": "cout << sizeof(int) << \" \" << sizeof(short) << \" \" << sizeof(long long) << endl;\ncout << sizeof(char) << \" \" << sizeof(bool) << endl;\ncout << sizeof(float) << \" \" << sizeof(double) << endl;", "stdin": null, "out": "4 2 8\n1 1\n4 8", "en": "`sizeof` gives the size in bytes. These numbers are typical but depend on the machine. `sizeof(char)` is always 1.", "ar": "`sizeof` يعطي الحجم بالـ bytes. هذه الأرقام شائعة لكنها تعتمد على الجهاز. أما `sizeof(char)` فهو دائماً 1."}, {"t": "p", "en": "**The key difference.** An `int` can never hold a fraction. When you store a `double` in an `int`, the fraction is **cut off** (truncated), not rounded. A `double` can hold a whole number like `5`, and `cout` prints it as `5`, not `5.0`.", "ar": "**الفرق الأساسي.** الـ `int` لا يخزّن كسراً أبداً. عند تخزين `double` في `int` يُحذف الكسر (truncation) ولا يُقرَّب. أما الـ `double` فيستطيع تخزين عدد صحيح مثل `5`، والـ `cout` يطبعه `5` وليس `5.0`."}, {"t": "code", "code": "int a = 7.9;\ndouble b = 7;\nchar c = 'A';\nbool t = true;\nstring s = \"Hi\";\ncout << a << \" \" << b << \" \" << c << \" \" << t << \" \" << s << endl;", "stdin": null, "out": "7 7 A 1 Hi", "en": "`int a = 7.9` keeps only `7`. The `bool` prints as `1`.", "ar": "`int a = 7.9` تحتفظ بـ `7` فقط. والـ `bool` يُطبع `1`."}, {"t": "code", "code": "cout << sizeof('A') << \" \" << sizeof(\"A\") << endl;\nfloat f = 3.14159265358979f;\ndouble d = 3.14159265358979;\ncout << setprecision(10) << f << \" \" << d << endl;", "stdin": null, "out": "1 2\n3.141592741 3.141592654", "en": "`'A'` is one `char` (1 byte). `\"A\"` is a string literal: the letter plus a hidden end marker (2 bytes). A `float` loses digits after about 7 places; a `double` keeps them.", "ar": "`'A'` هو `char` واحد (1 byte). أما `\"A\"` فهو string literal: الحرف مع علامة نهاية مخفية (2 bytes). الـ `float` يفقد الأرقام بعد حوالي 7 خانات، والـ `double` يحتفظ بها."}, {"t": "trap", "en": "Single quotes mean a character (`'A'`). Double quotes mean text (`\"A\"`). They are different types.", "ar": "علامة الاقتباس المفردة تعني حرفاً (`'A'`). والمزدوجة تعني نصاً (`\"A\"`). نوعان مختلفان."}]}, {"id": "sec-4", "num": "2.3", "title_en": "Arithmetic, integer division and precedence", "title_ar": "الحساب والقسمة الصحيحة والأولويات", "blocks": [{"t": "p", "en": "The rule that decides most output questions: **int ÷ int gives an int**. The fraction is thrown away. If at least one side is a `double`, the result is a `double`.", "ar": "القاعدة التي تحسم معظم أسئلة الـ output: **int ÷ int يعطي int** ويُحذف الكسر. وإذا كان أحد الطرفين على الأقل `double` فالناتج `double`."}, {"t": "code", "code": "cout << 7 / 2 << endl;\ncout << 7 % 2 << endl;\ncout << 7.0 / 2 << endl;\ncout << -7 / 2 << endl;\ncout << -7 % 2 << endl;\ncout << 1 / 3 << endl;\ncout << 1 / 3.0 << endl;\ncout << 5 % 10 << endl;", "stdin": null, "out": "3\n1\n3.5\n-3\n-1\n0\n0.333333\n5", "en": "`%` is the remainder and works on integers only. Its sign follows the left operand (`-7 % 2` is `-1`). Division truncates toward zero (`-7 / 2` is `-3`).", "ar": "`%` هو باقي القسمة ويعمل على الأعداد الصحيحة فقط. وإشارته تتبع الطرف الأيسر (`-7 % 2` تساوي `-1`). والقسمة تقطع باتجاه الصفر (`-7 / 2` تساوي `-3`)."}, {"t": "code", "code": "double x = 7 / 2;\ncout << x << endl;\nint y = 7.9;\ncout << y << endl;\nint z = 3.99 + 2.99;\ncout << z << endl;\ndouble w = 7 / 2.0;\ncout << w << endl;", "stdin": null, "out": "3\n7\n6\n3.5", "en": "In `double x = 7 / 2;` the division happens first, as `int / int = 3`. Only then is `3` converted to `3.0`. Conversion happens **after** the calculation.", "ar": "في `double x = 7 / 2;` تحدث القسمة أولاً كـ `int / int = 3`، وبعدها فقط يتحوّل `3` إلى `3.0`. التحويل يحدث **بعد** الحساب."}, {"t": "p", "en": "**Precedence** (strongest first): `()`, then `++ --`, then `!` and unary minus, then `* / %`, then `+ -`. Operators on the same level are evaluated left to right.", "ar": "**الأولوية** (من الأقوى): `()`، ثم `++ --`، ثم `!` والسالب الأحادي، ثم `* / %`، ثم `+ -`. العمليات على نفس المستوى تُنفَّذ من اليسار إلى اليمين."}, {"t": "code", "code": "cout << 2 + 3 * 4 << endl;\ncout << (2 + 3) * 4 << endl;\ncout << 10 - 4 - 3 << endl;\ncout << 2 * 3 % 4 << endl;\ncout << 10 / 3 * 3 << endl;\ncout << 10 % 3 * 2 << endl;\ncout << 2 + 10 / 4 << endl;\ncout << 2 + 10 / 4.0 << endl;\ncout << 100 / 10 / 5 << endl;\ncout << 5 + 3 % 2 * 4 << endl;", "stdin": null, "out": "14\n20\n3\n2\n9\n2\n4\n4.5\n2\n9", "en": "Trace `10 / 3 * 3`: left to right, `(10 / 3) * 3 = 3 * 3 = 9`, not 10.", "ar": "تتبّع `10 / 3 * 3`: من اليسار لليمين `(10 / 3) * 3 = 3 * 3 = 9` وليس 10."}, {"t": "trap", "en": "`/` and `*` have the same level, so `10 / 3 * 3` is not 10. Write the type of each side next to every `/`.", "ar": "الـ `/` و`*` على نفس المستوى، لذلك `10 / 3 * 3` لا تساوي 10. اكتب نوع كل طرف بجانب كل `/`."}]}, {"id": "sec-5", "num": "2.4", "title_en": "Casting and the char type", "title_ar": "التحويل (casting) والنوع char", "blocks": [{"t": "p", "en": "**Implicit conversion** happens automatically: in a mixed expression the narrower type is promoted to the wider one (`int` becomes `double`; `char` becomes `int`). **Explicit conversion** (a cast) is written by you: `(double)x` or `static_cast<double>(x)`. A cast applies to the value right after it, **before** the division.", "ar": "**التحويل الضمني (implicit)** يحدث تلقائياً: في التعبير المختلط يُرفع النوع الأضيق إلى الأوسع (`int` يصبح `double`، و`char` يصبح `int`). **التحويل الصريح (cast)** تكتبه أنت: `(double)x` أو `static_cast<double>(x)`. الـ cast يُطبَّق على القيمة التي تليه مباشرة، **قبل** القسمة."}, {"t": "code", "code": "int a = 5, b = 2;\ncout << a / b << endl;\ncout << (double)a / b << endl;\ncout << (double)(a / b) << endl;\ncout << static_cast<double>(a) / b << endl;\ncout << static_cast<int>(3.99) << endl;\ncout << static_cast<int>(-3.99) << endl;\ncout << static_cast<int>(3.5 + 0.5) << endl;\ncout << 5 / 2 * 2.0 << endl;\ncout << 5 / 2.0 * 2 << endl;", "stdin": null, "out": "2\n2.5\n2\n2.5\n3\n-3\n4\n4\n5", "en": "`(double)a / b` converts `a` first, so the division is real: 2.5. `(double)(a / b)` divides as integers first (2), then converts. The last two lines show that the order of operands changes the answer.", "ar": "`(double)a / b` يحوّل `a` أولاً فتصبح القسمة حقيقية: 2.5. أما `(double)(a / b)` فتقسم كأعداد صحيحة أولاً (2) ثم تحوّل. وآخر سطرين يوضحان أن ترتيب الأطراف يغيّر النتيجة."}, {"t": "p", "en": "A `char` is a number in disguise. In arithmetic it is treated as its ASCII code, so `'A' + 1` is the **int** 66. Convert back with `char(...)` to print a letter.", "ar": "الـ `char` رقم متنكّر. في العمليات الحسابية يُعامل كرمز ASCII الخاص به، لذلك `'A' + 1` هي العدد الصحيح **int** 66. حوّله بـ `char(...)` لتطبع حرفاً."}, {"t": "code", "code": "cout << 'a' << endl;\ncout << \"a\" << endl;\ncout << 'a' + 1 << endl;\ncout << (char)('a' + 1) << endl;\ncout << '5' - '0' << endl;\ncout << 5 << '5' << \"5\" << endl;\ncout << int('A') << endl;\ncout << char(66) << endl;", "stdin": null, "out": "a\na\n98\nb\n5\n555\n65\nB", "en": "`'5' - '0'` is `53 - 48 = 5`: the standard trick to turn a digit character into a number.", "ar": "`'5' - '0'` تساوي `53 - 48 = 5`: الحيلة المعروفة لتحويل حرف رقم إلى عدد."}, {"t": "trap", "en": "`cout << 'A' + 1` prints **66**, not `B`. Only `cout << char('A' + 1)` prints `B`.", "ar": "`cout << 'A' + 1` تطبع **66** وليس `B`. فقط `cout << char('A' + 1)` تطبع `B`."}]}, {"id": "sec-6", "num": "2.5", "title_en": "Increment, assignment and strings", "title_ar": "الزيادة والإسناد والنصوص", "blocks": [{"t": "p", "en": "`x++` (**postfix**) gives you the **old** value, then adds 1. `++x` (**prefix**) adds 1, then gives you the **new** value. A compound assignment `x op= y` means `x = x op (y)`, with everything on the right in parentheses.", "ar": "`x++` (**postfix**) تعطيك القيمة **القديمة** ثم تزيد 1. و`++x` (**prefix**) تزيد 1 ثم تعطيك القيمة **الجديدة**. والإسناد المركّب `x op= y` يعني `x = x op (y)` مع وضع كل ما على اليمين بين قوسين."}, {"t": "code", "code": "int x = 5;\nint y = x++;\ncout << x << \" \" << y << endl;\nint a = 5;\nint b = ++a;\ncout << a << \" \" << b << endl;\nint c = 10;\nc += 5;  cout << c << endl;\nc -= 3;  cout << c << endl;\nc *= 2 + 1; cout << c << endl;\nc /= 4;  cout << c << endl;\nc %= 5;  cout << c << endl;", "stdin": null, "out": "6 5\n6 6\n15\n12\n36\n9\n4", "en": "`c *= 2 + 1` is `c = c * (2 + 1)`. After `y = x++`, y holds the old 5 and x is already 6.", "ar": "`c *= 2 + 1` تعني `c = c * (2 + 1)`. بعد `y = x++` يحمل y القيمة القديمة 5 ويكون x قد أصبح 6."}, {"t": "list", "ordered": false, "en": ["`const double PI = 3.14159;` can never change after it is defined, so it must be given a value immediately.", "Chained assignment goes right to left: `a = b = c = 5;`.", "To swap two variables you need a temporary one.", "`int a, b = 5;` leaves `a` without a value (garbage); only `b` is initialized."], "ar": ["`const double PI = 3.14159;` لا يمكن تغييرها بعد التعريف، لذلك يجب إعطاؤها قيمة فوراً.", "الإسناد المتسلسل يتم من اليمين لليسار: `a = b = c = 5;`.", "لتبديل متغيرين تحتاج متغيراً مؤقتاً.", "`int a, b = 5;` تترك `a` بدون قيمة (garbage)؛ فقط `b` تأخذ قيمة."]}, {"t": "code", "code": "const double PI = 3.14159;\ndouble r = 2;\ncout << PI * r * r << endl;\nint a, b, c;\na = b = c = 5;\ncout << a << b << c << endl;\nint p = 3, q = 8, temp;\ntemp = p; p = q; q = temp;\ncout << p << \" \" << q << endl;", "stdin": null, "out": "12.5664\n555\n8 3", "en": "", "ar": ""}, {"t": "p", "en": "**Strings** (from `<string>`): `+` joins, `.length()` and `.size()` give the length, `s[i]` and `.at(i)` read a character (index starts at 0), `.substr(start, count)` extracts a piece, and `.find(text)` returns the position (or `string::npos` if absent). Strings compare letter by letter in ASCII order.", "ar": "**النصوص (strings)** من `<string>`: `+` للدمج، و`.length()` و`.size()` للطول، و`s[i]` و`.at(i)` لقراءة حرف (يبدأ الفهرس من 0)، و`.substr(start, count)` لاستخراج جزء، و`.find(text)` ترجع الموضع (أو `string::npos` إن لم تجده). تُقارن النصوص حرفاً بحرف حسب ترتيب ASCII."}, {"t": "code", "code": "string s = \"Hello\";\nstring t = \" World\";\nstring u = s + t;\ncout << u << endl;\ncout << u.length() << \" \" << u.size() << endl;\ncout << u.at(0) << u[4] << endl;\ncout << u.substr(6, 3) << endl;\ncout << u.find(\"World\") << endl;\ncout << (u.find(\"xyz\") == string::npos) << endl;\nstring a = \"apple\", b = \"banana\";\ncout << (a < b) << endl;", "stdin": null, "out": "Hello World\n11 11\nHo\nWor\n6\n1\n1", "en": "`substr(6, 3)` starts at index 6 and takes 3 characters.", "ar": "`substr(6, 3)` تبدأ من الفهرس 6 وتأخذ 3 أحرف."}, {"t": "trap", "en": "Never write `x++ + ++x` (same variable twice with `++`). The result is undefined. Exam questions use different variables.", "ar": "لا تكتب `x++ + ++x` (نفس المتغير مرتين مع `++`). النتيجة غير محددة (undefined). أسئلة الامتحان تستخدم متغيرات مختلفة."}]}], "quiz": [{"stem_en": "Which one is a valid identifier?", "stem_ar": "أي مما يلي identifier صالح؟", "code": null, "stdin": null, "options": ["2ndPlace", "first-name", "int", "total_score"], "answer": 3, "why_en": "Letters, digits and `_` are allowed, but it cannot start with a digit, contain `-`, or be a reserved word.", "why_ar": "مسموح بالحروف والأرقام و`_` لكن لا يبدأ برقم ولا يحتوي `-` ولا يكون كلمة محجوزة.", "mono": false, "id": "sec-2-q0", "n": 1, "tag": "2.1 · Anatomy of a C++ program", "ref": "sec-2:4", "ref_label": "2.1 · Anatomy of a C++ program", "idea_en": "An identifier uses letters, digits and `_`. It cannot start with a digit, contain a space or `-`, or be a reserved word.", "idea_ar": "الـ identifier يتكوّن من حروف وأرقام و`_`. ولا يبدأ برقم ولا يحتوي مسافة أو `-` ولا يكون كلمة محجوزة."}, {"stem_en": "Are `Total` and `total` the same identifier in C++?", "stem_ar": "هل `Total` و`total` نفس الـ identifier في C++؟", "code": null, "stdin": null, "options": ["Only inside main", "No, C++ is case-sensitive", "Only when declared const", "Yes, case is ignored"], "answer": 1, "why_en": "C++ treats upper and lower case as different letters.", "why_ar": "C++ يعتبر الحرف الكبير والصغير حرفين مختلفين.", "mono": false, "id": "sec-2-q1", "n": 2, "tag": "2.1 · Anatomy of a C++ program", "ref": "sec-2:5", "ref_label": "2.1 · Anatomy of a C++ program", "idea_en": "C++ is case-sensitive: `Total` and `total` are two different names.", "idea_ar": "لغة C++ حساسة لحالة الأحرف: `Total` و`total` اسمان مختلفان."}, {"stem_en": "What does `return 0;` at the end of `main` normally mean?", "stem_ar": "ماذا تعني `return 0;` في نهاية `main` عادةً؟", "code": null, "stdin": null, "options": ["The program finished successfully", "main failed", "Memory was cleared", "The program prints 0"], "answer": 0, "why_en": "0 is the success code returned to the operating system.", "why_ar": "الرقم 0 هو رمز النجاح الذي يُرجَع لنظام التشغيل.", "mono": false, "id": "sec-2-q2", "n": 3, "tag": "2.1 · Anatomy of a C++ program", "ref": "sec-2:2", "ref_label": "2.1 · Anatomy of a C++ program", "idea_en": "`main` is where the program starts. `#include <iostream>` gives `cout` and `cin`. `return 0;` means success. Comments (`//` and `/* */`) are ignored.", "idea_ar": "الدالة `main` هي بداية البرنامج. و`#include <iostream>` تعطيك `cout` و`cin`. و`return 0;` تعني النجاح. التعليقات (`//` و`/* */`) تُتجاهل."}, {"stem_en": "What does this print?", "stem_ar": "ماذا يطبع هذا الكود؟", "code": "// cout << \"A\" << endl;\ncout << \"B\" << endl;\n/* cout << \"C\" << endl;\n   cout << \"D\" << endl; */\ncout << \"E\" << endl;", "stdin": null, "options": ["A\nB\nE", "B", "B\nC\nD\nE", "B\nE"], "answer": 3, "why_en": "Both `//` and `/* ... */` comment the code out, so only B and E are printed.", "why_ar": "كل من `//` و`/* ... */` يعطّل الكود، فيُطبع B و E فقط.", "mono": true, "id": "sec-2-q3", "n": 4, "tag": "2.1 · Anatomy of a C++ program", "ref": "sec-2:2", "ref_label": "2.1 · Anatomy of a C++ program", "idea_en": "`main` is where the program starts. `#include <iostream>` gives `cout` and `cin`. `return 0;` means success. Comments (`//` and `/* */`) are ignored.", "idea_ar": "الدالة `main` هي بداية البرنامج. و`#include <iostream>` تعطيك `cout` و`cin`. و`return 0;` تعني النجاح. التعليقات (`//` و`/* */`) تُتجاهل."}, {"stem_en": "Which line gives you `cout` and `cin`?", "stem_ar": "أي سطر يعطيك `cout` و`cin`؟", "code": null, "stdin": null, "options": ["#include <iostream>", "using cout;", "#include <string>", "#include <cmath>"], "answer": 0, "why_en": "`<iostream>` is the header for input and output streams.", "why_ar": "`<iostream>` هو الـ header الخاص بتدفقات الإدخال والإخراج.", "mono": false, "id": "sec-2-q4", "n": 5, "tag": "2.1 · Anatomy of a C++ program", "ref": "sec-2:2", "ref_label": "2.1 · Anatomy of a C++ program", "idea_en": "`main` is where the program starts. `#include <iostream>` gives `cout` and `cin`. `return 0;` means success. Comments (`//` and `/* */`) are ignored.", "idea_ar": "الدالة `main` هي بداية البرنامج. و`#include <iostream>` تعطيك `cout` و`cin`. و`return 0;` تعني النجاح. التعليقات (`//` و`/* */`) تُتجاهل."}, {"stem_en": "What does this print?", "stem_ar": "ماذا يطبع هذا الكود؟", "code": "int x = 3.99;\ncout << x;", "stdin": null, "options": ["3.99", "3.9", "3", "4"], "answer": 2, "why_en": "The fraction is truncated, never rounded: 3.99 becomes 3.", "why_ar": "الكسر يُحذف ولا يُقرَّب: 3.99 تصبح 3.", "mono": true, "id": "sec-3-q0", "n": 6, "tag": "2.2 · Data types: int vs double", "ref": "sec-3:3", "ref_label": "2.2 · Data types: int vs double", "idea_en": "Storing a double in an int cuts off the fraction (3.99 becomes 3), it does not round. `cout` prints the double 5 as `5`.", "idea_ar": "تخزين double في int يحذف الكسر (3.99 تصبح 3) ولا يقرّب. والـ `cout` يطبع الـ double ‏5 هكذا: `5`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "double d = 5;\ncout << d;", "stdin": null, "options": ["0.5", "5.00000", "5.0", "5"], "answer": 3, "why_en": "`cout` drops the unnecessary `.0`, so the double 5 prints as `5`.", "why_ar": "الـ `cout` يحذف الـ `.0` غير الضروري، فيُطبع الـ double الذي قيمته 5 هكذا: `5`.", "mono": true, "id": "sec-3-q1", "n": 7, "tag": "2.2 · Data types: int vs double", "ref": "sec-3:3", "ref_label": "2.2 · Data types: int vs double", "idea_en": "Storing a double in an int cuts off the fraction (3.99 becomes 3), it does not round. `cout` prints the double 5 as `5`.", "idea_ar": "تخزين double في int يحذف الكسر (3.99 تصبح 3) ولا يقرّب. والـ `cout` يطبع الـ double ‏5 هكذا: `5`."}, {"stem_en": "Which type is meant for one character such as the letter A?", "stem_ar": "أي نوع مخصص لحرف واحد مثل الحرف A؟", "code": null, "stdin": null, "options": ["char", "double", "bool", "string"], "answer": 0, "why_en": "`char` holds a single character; `string` holds text.", "why_ar": "`char` يخزّن حرفاً واحداً، و`string` يخزّن نصاً.", "mono": false, "id": "sec-3-q2", "n": 8, "tag": "2.2 · Data types: int vs double", "ref": "sec-3:1", "ref_label": "2.2 · Data types: int vs double", "idea_en": "`int` holds whole numbers, `double` holds real numbers (about 15 digits), `float` holds fewer digits (about 7), `char` holds one character, `bool` holds true/false.", "idea_ar": "الـ `int` للأعداد الصحيحة، والـ `double` للأعداد الحقيقية (حوالي 15 رقماً)، والـ `float` بدقة أقل (حوالي 7 أرقام)، والـ `char` لحرف واحد، والـ `bool` لـ true/false."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << sizeof('A') << \" \" << sizeof(\"A\");", "stdin": null, "options": ["1 1", "2 2", "2 1", "1 2"], "answer": 3, "why_en": "`'A'` is one char. `\"A\"` has the letter plus a terminating character, so 2 bytes.", "why_ar": "`'A'` حرف واحد. أما `\"A\"` ففيه الحرف وحرف نهاية، أي 2 bytes.", "mono": true, "id": "sec-3-q3", "n": 9, "tag": "2.2 · Data types: int vs double", "ref": "sec-3:5", "ref_label": "2.2 · Data types: int vs double", "idea_en": "`'A'` is one char (1 byte). `\"A\"` is text: the letter plus a hidden end marker (2 bytes).", "idea_ar": "`'A'` حرف واحد (1 byte). أما `\"A\"` فنص: الحرف مع علامة نهاية مخفية (2 bytes)."}, {"stem_en": "Which is more precise?", "stem_ar": "أيهما أدق؟", "code": null, "stdin": null, "options": ["float (about 15 digits)", "It depends only on the value", "double (about 15 digits)", "They are identical"], "answer": 2, "why_en": "`double` uses 8 bytes and keeps about 15 significant digits; `float` keeps about 7.", "why_ar": "الـ `double` يستخدم 8 bytes ويحتفظ بحوالي 15 رقماً معنوياً، والـ `float` بحوالي 7.", "mono": false, "id": "sec-3-q4", "n": 10, "tag": "2.2 · Data types: int vs double", "ref": "sec-3:1", "ref_label": "2.2 · Data types: int vs double", "idea_en": "`int` holds whole numbers, `double` holds real numbers (about 15 digits), `float` holds fewer digits (about 7), `char` holds one character, `bool` holds true/false.", "idea_ar": "الـ `int` للأعداد الصحيحة، والـ `double` للأعداد الحقيقية (حوالي 15 رقماً)، والـ `float` بدقة أقل (حوالي 7 أرقام)، والـ `char` لحرف واحد، والـ `bool` لـ true/false."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "bool b = 5;\ncout << b;", "stdin": null, "options": ["0", "true", "5", "1"], "answer": 3, "why_en": "Any non-zero value becomes `true`, and a `bool` prints as `1`.", "why_ar": "أي قيمة غير صفرية تصبح `true`، والـ `bool` يُطبع `1`.", "mono": true, "id": "sec-3-q5", "n": 11, "tag": "2.2 · Data types: int vs double", "ref": "sec-3:4", "ref_label": "2.2 · Data types: int vs double", "idea_en": "A `bool` takes any non-zero value as true, and it prints as `1` (false prints `0`).", "idea_ar": "الـ `bool` يعتبر أي قيمة غير صفرية true، ويُطبع `1` (و false تُطبع `0`)."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << 7 / 2;", "stdin": null, "options": ["3", "3.5", "4", "2"], "answer": 0, "why_en": "Both operands are int, so the result is int: 3.", "why_ar": "الطرفان int فالناتج int: 3.", "mono": true, "id": "sec-4-q0", "n": 12, "tag": "2.3 · Arithmetic, integer division and precedence", "ref": "sec-4:0", "ref_label": "2.3 · Arithmetic, integer division and precedence", "idea_en": "int ÷ int gives an int (the fraction is dropped). If either side is a double, the result is a double.", "idea_ar": "قسمة int على int تعطي int (يُحذف الكسر). وإذا كان أحد الطرفين double فالناتج double."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << -7 % 2;", "stdin": null, "options": ["0", "-3", "1", "-1"], "answer": 3, "why_en": "The remainder takes the sign of the left operand: -7 % 2 = -1.", "why_ar": "الباقي يأخذ إشارة الطرف الأيسر: -7 % 2 = -1.", "mono": true, "id": "sec-4-q1", "n": 13, "tag": "2.3 · Arithmetic, integer division and precedence", "ref": "sec-4:1", "ref_label": "2.3 · Arithmetic, integer division and precedence", "idea_en": "`%` is the remainder and works on integers only. Its sign follows the left number. Division truncates toward zero.", "idea_ar": "الـ `%` هو الباقي ويعمل على الأعداد الصحيحة فقط. وإشارته تتبع العدد الأيسر. والقسمة تقطع باتجاه الصفر."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "double x = 9 / 2;\ncout << x;", "stdin": null, "options": ["4.5", "4.0", "5", "4"], "answer": 3, "why_en": "9 / 2 is integer division = 4. Then 4 is stored in a double and prints as 4.", "why_ar": "9 / 2 قسمة صحيحة = 4. ثم يُخزَّن 4 في double ويُطبع 4.", "mono": true, "id": "sec-4-q2", "n": 14, "tag": "2.3 · Arithmetic, integer division and precedence", "ref": "sec-4:2", "ref_label": "2.3 · Arithmetic, integer division and precedence", "idea_en": "The conversion happens after the calculation: `double x = 9 / 2;` divides as ints first (4) and only then stores 4.0.", "idea_ar": "التحويل يحدث بعد الحساب: `double x = 9 / 2;` تقسم كـ int أولاً (4) ثم تخزّن 4.0 فقط."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << 10 / 3 * 3;", "stdin": null, "options": ["9", "3", "1", "10"], "answer": 0, "why_en": "(10 / 3) = 3, then 3 * 3 = 9.", "why_ar": "(10 / 3) = 3 ثم 3 * 3 = 9.", "mono": true, "id": "sec-4-q3", "n": 15, "tag": "2.3 · Arithmetic, integer division and precedence", "ref": "sec-4:4", "ref_label": "2.3 · Arithmetic, integer division and precedence", "idea_en": "`* / %` come before `+ -`, and the same level goes left to right. Write each step: `10 / 3 * 3` is `3 * 3`, which is 9.", "idea_ar": "الـ `* / %` قبل `+ -` وعلى نفس المستوى من اليسار لليمين. اكتب كل خطوة: `10 / 3 * 3` تصبح `3 * 3` أي 9."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << 2 + 10 / 4.0;", "stdin": null, "options": ["4", "4.5", "3", "3.5"], "answer": 1, "why_en":  B.", "why_ar": "الـ cast يحوّل 66 إلى الحرف B.", "mono": true, "id": "sec-5-q3", "n": 21, "tag": "2.4 · Casting and the char type", "ref": "sec-5:2", "ref_label": "2.4 · Casting and the char type", "idea_en": "In arithmetic a char is its ASCII number: `'A' + 1` is 66. Use `char(...)` to turn a number back into a letter. A digit character minus `'0'` gives the digit.", "idea_ar": "في الحساب يُعامل الـ char كرقم ASCII الخاص به: `'A' + 1` تساوي 66. استخدم `char(...)` لإرجاع الرقم إلى حرف. وطرح `'0'` من حرف رقم يعطي الرقم نفسه."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << static_cast<int>(-3.99);", "stdin": null, "options": ["-3", "-4", "-3.99", "3"], "answer": 0, "why_en": "A cast to int truncates toward zero: -3.", "why_ar": "التحويل إلى int يقطع باتجاه الصفر: -3.", "mono": true, "id": "sec-5-q4", "n": 22, "tag": "2.4 · Casting and the char type", "ref": "sec-5:1", "ref_label": "2.4 · Casting and the char type", "idea_en": "A cast applies to the value right after it, before the division. `(double)a / b` converts a first; `(double)(a / b)` divides as ints first. Casting to int truncates toward zero.", "idea_ar": "الـ cast يُطبَّق على القيمة التي بعده مباشرة قبل القسمة. `(double)a / b` تحوّل a أولاً، و`(double)(a / b)` تقسم كـ int أولاً. والتحويل إلى int يقطع باتجاه الصفر."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << '7' - '0';", "stdin": null, "options": ["7", "0", "55", "1"], "answer": 0, "why_en": "'7' is 55 and '0' is 48, so 55 - 48 = 7.", "why_ar": "الحرف '7' يساوي 55 والحرف '0' يساوي 48 فالناتج 7.", "mono": true, "id": "sec-5-q5", "n": 23, "tag": "2.4 · Casting and the char type", "ref": "sec-5:2", "ref_label": "2.4 · Casting and the char type", "idea_en": "In arithmetic a char is its ASCII number: `'A' + 1` is 66. Use `char(...)` to turn a number back into a letter. A digit character minus `'0'` gives the digit.", "idea_ar": "في الحساب يُعامل الـ char كرقم ASCII الخاص به: `'A' + 1` تساوي 66. استخدم `char(...)` لإرجاع الرقم إلى حرف. وطرح `'0'` من حرف رقم يعطي الرقم نفسه."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int x = 5;\nint y = x++;\ncout << x << \" \" << y;", "stdin": null, "options": ["6 5", "5 6", "6 6", "5 5"], "answer": 0, "why_en": "`x++` gives y the old value 5, and then x becomes 6.", "why_ar": "`x++` تعطي y القيمة القديمة 5 ثم يصبح x ‏6.", "mono": true, "id": "sec-6-q0", "n": 24, "tag": "2.5 · Increment, assignment and strings", "ref": "sec-6:0", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`x++` gives the old value, then adds 1. `++x` adds 1, then gives the new value. `x op= y` means `x = x op (y)`.", "idea_ar": "`x++` تعطي القيمة القديمة ثم تزيد 1. و`++x` تزيد 1 ثم تعطي القيمة الجديدة. و`x op= y` تعني `x = x op (y)`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int a = 5;\nint b = ++a;\ncout << a << \" \" << b;", "stdin": null, "options": ["6 6", "5 6", "5 5", "6 5"], "answer": 0, "why_en": "`++a` adds 1 first, so both a and b are 6.", "why_ar": "`++a` تزيد 1 أولاً فيصبح a و b كلاهما 6.", "mono": true, "id": "sec-6-q1", "n": 25, "tag": "2.5 · Increment, assignment and strings", "ref": "sec-6:0", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`x++` gives the old value, then adds 1. `++x` adds 1, then gives the new value. `x op= y` means `x = x op (y)`.", "idea_ar": "`x++` تعطي القيمة القديمة ثم تزيد 1. و`++x` تزيد 1 ثم تعطي القيمة الجديدة. و`x op= y` تعني `x = x op (y)`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int c = 10;\nc *= 2 + 1;\ncout << c;", "stdin": null, "options": ["20", "30", "21", "12"], "answer": 1, "why_en": "`c *= 2 + 1` means c = c * (2 + 1) = 30, not 10 * 2 + 1.", "why_ar": "`c *= 2 + 1` تعني c = c * (2 + 1) = 30 وليس 10 * 2 + 1.", "mono": true, "id": "sec-6-q2", "n": 26, "tag": "2.5 · Increment, assignment and strings", "ref": "sec-6:0", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`x++` gives the old value, then adds 1. `++x` adds 1, then gives the new value. `x op= y` means `x = x op (y)`.", "idea_ar": "`x++` تعطي القيمة القديمة ثم تزيد 1. و`++x` تزيد 1 ثم تعطي القيمة الجديدة. و`x op= y` تعني `x = x op (y)`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "int c = 17;\nc %= 5;\nc += 3;\ncout << c;", "stdin": null, "options": ["5", "20", "3", "2"], "answer": 0, "why_en": "17 % 5 = 2, then 2 + 3 = 5.", "why_ar": "17 % 5 = 2 ثم 2 + 3 = 5.", "mono": true, "id": "sec-6-q3", "n": 27, "tag": "2.5 · Increment, assignment and strings", "ref": "sec-6:0", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`x++` gives the old value, then adds 1. `++x` adds 1, then gives the new value. `x op= y` means `x = x op (y)`.", "idea_ar": "`x++` تعطي القيمة القديمة ثم تزيد 1. و`++x` تزيد 1 ثم تعطي القيمة الجديدة. و`x op= y` تعني `x = x op (y)`."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "string s = \"Hello World\";\ncout << s.substr(6, 3) << \" \" << s.length();", "stdin": null, "options": ["Wor 10", "World 11", "Wor 11", "orl 11"], "answer": 2, "why_en": "Index 6 is `W`; three characters are `Wor`. The length is 11 (the space counts).", "why_ar": "الفهرس 6 هو `W` وثلاثة أحرف تعطي `Wor`. الطول 11 (المسافة تُحسب).", "mono": true, "id": "sec-6-q4", "n": 28, "tag": "2.5 · Increment, assignment and strings", "ref": "sec-6:4", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`s.substr(start, count)` takes `count` characters from index `start` (indexes begin at 0). Two string literals cannot be joined with `+`.", "idea_ar": "الدالة `s.substr(start, count)` تأخذ `count` حرفاً بدءاً من الفهرس `start` (الفهارس تبدأ من 0). ولا يمكن جمع string literals بـ `+`."}, {"stem_en": "Which line does NOT compile?", "stem_ar": "أي سطر لا يُترجَم (compile error)؟", "code": null, "stdin": null, "options": ["string s = \"A\" + \"B\";", "string s = string(\"A\") + \"B\";", "string s = \"A\" + string(\"B\");", "string s = \"AB\";"], "answer": 0, "why_en": "You cannot add two string literals. At least one side must be a `string` object.", "why_ar": "لا يمكن جمع string literals مباشرة. يجب أن يكون أحد الطرفين كائن `string`.", "mono": false, "id": "sec-6-q5", "n": 29, "tag": "2.5 · Increment, assignment and strings", "ref": "sec-6:4", "ref_label": "2.5 · Increment, assignment and strings", "idea_en": "`s.substr(start, count)` takes `count` characters from index `start` (indexes begin at 0). Two string literals cannot be joined with `+`.", "idea_ar": "الدالة `s.substr(start, count)` تأخذ `count` حرفاً بدءاً من الفهرس `start` (الفهارس تبدأ من 0). ولا يمكن جمع string literals بـ `+`."}], "quiz_secs": ["sec-2", "sec-3", "sec-4", "sec-5", "sec-6"]}, {"id": "ch-3", "kicker": "Chapter 3", "title_en": "Input and output", "title_ar": "الإدخال والإخراج", "intro_en": "Printing with cout, reading with cin, library functions and files.", "intro_ar": "الطباعة بـ cout والقراءة بـ cin والدوال الجاهزة والملفات.", "sections": [{"id": "sec-7", "num": "3.1", "title_en": "Output: cout and formatting", "title_ar": "الإخراج: cout والتنسيق", "blocks": [{"t": "p", "en": "Escape sequences: `\\n` new line, `\\t` tab, `\\\\` backslash, `\\\"` quote, `\\'` apostrophe. `endl` is a new line **plus** a flush of the output buffer; `'\\n'` is only the new line. On screen they look the same.", "ar": "الـ escape sequences: `\\n` سطر جديد، `\\t` مسافة tab، `\\\\` شرطة معكوسة، `\\\"` علامة اقتباس، `\\'` فاصلة عليا. الـ `endl` سطر جديد **مع** تفريغ (flush) لذاكرة الإخراج المؤقتة، أما `'\\n'` فسطر جديد فقط. على الشاشة يبدوان متطابقين."}, {"t": "code", "code": "cout << \"Hello\\nWorld\" << endl;\ncout << \"A\\tB\\tC\" << endl;\ncout << \"She said \\\"Hi\\\"\" << endl;\ncout << \"Path: C:\\\\temp\" << endl;", "stdin": null, "out": "Hello\nWorld\nA\tB\tC\nShe said \"Hi\"\nPath: C:\\temp", "en": "", "ar": ""}, {"t": "p", "en": "**Default number printing:** `cout` shows at most **6 significant digits**, removes useless zeros, and may switch to scientific notation.", "ar": "**الطباعة الافتراضية للأرقام:** يعرض `cout` **6 أرقام معنوية** كحد أقصى، ويحذف الأصفار غير المفيدة، وقد يتحول إلى الصيغة العلمية."}, {"t": "code", "code": "cout << 100000.0 << endl;\ncout << 1234567.0 << endl;\ncout << 0.00001234 << endl;\ncout << 2.50 << endl;\ncout << 2.0 << endl;\ncout << 10 / 4.0 << endl;\ncout << 1.0 / 3 << endl;", "stdin": null, "out": "100000\n1.23457e+06\n1.234e-05\n2.5\n2\n2.5\n0.333333", "en": "", "ar": ""}, {"t": "list", "ordered": false, "en": ["`fixed` + `setprecision(n)`: exactly **n digits after the decimal point**. Without `fixed`, `setprecision(n)` means n **significant digits in total**.", "`setw(n)`: width of the **next item only**; right-aligned by default; use `left` / `right` to change. It never cuts a longer value.", "`setfill(c)` chooses the padding character. `showpoint` prints the decimal point and trailing zeros. `boolalpha` prints `true`/`false`."], "ar": ["`fixed` مع `setprecision(n)`: **n رقماً بعد الفاصلة** بالضبط. وبدون `fixed` فإن `setprecision(n)` تعني n **رقماً معنوياً بالمجموع**.", "`setw(n)`: عرض **العنصر التالي فقط**؛ المحاذاة لليمين افتراضياً؛ استخدم `left` / `right` للتغيير. لا يقصّ أبداً قيمة أطول منه.", "`setfill(c)` تختار حرف التعبئة. `showpoint` تطبع الفاصلة والأصفار الأخيرة. `boolalpha` تطبع `true`/`false`."]}, {"t": "code", "code": "double pi = 3.14159265;\ncout << fixed << setprecision(2) << pi << endl;\ncout << setw(8) << 42 << \"|\" << endl;\ncout << left << setw(8) << 42 << \"|\" << endl;\ncout << right << setfill('*') << setw(8) << 42 << endl;\ncout << setw(3) << 12345 << endl;\ncout << 7 << setw(5) << 8 << endl;", "stdin": null, "out": "3.14\n      42|\n42      |\n******42\n12345\n7****8", "en": "`fixed` and `setprecision` stay active until changed. `setw` affects only the next item. `setfill` stays active, which is why the last line is padded with `*`.", "ar": "`fixed` و`setprecision` تبقيان فعّالتين حتى تغيّرهما. أما `setw` فتؤثر على العنصر التالي فقط. و`setfill` تبقى فعّالة، ولهذا امتلأ السطر الأخير بـ `*`."}, {"t": "code", "code": "cout << setprecision(3) << 3.14159 << \" \" << 1234.5678 << \" \" << 0.5 << endl;\ncout << fixed << setprecision(3) << 3.14159 << \" \" << 2.0 << \" \" << 10 << endl;", "stdin": null, "out": "3.14 1.23e+03 0.5\n3.142 2.000 10", "en": "Without `fixed`, 3 significant digits turns `1234.5678` into `1.23e+03`. Integers such as `10` ignore `fixed` and `setprecision`.", "ar": "بدون `fixed` فإن 3 أرقام معنوية تحوّل `1234.5678` إلى `1.23e+03`. الأعداد الصحيحة مثل `10` تتجاهل `fixed` و`setprecision`."}, {"t": "trap", "en": "`setprecision(2)` alone does **not** mean two decimals. You need `fixed` for that.", "ar": "`setprecision(2)` وحدها **لا** تعني خانتين عشريتين. تحتاج `fixed` لذلك."}]}, {"id": "sec-8", "num": "3.2", "title_en": "Input: cin and getline", "title_ar": "الإدخال: cin و getline", "blocks": [{"t": "list", "ordered": false, "en": ["`cin >> x` skips spaces and newlines, reads one value, and stops at the next whitespace.", "Reading a `string` with `>>` gives **one word**. Use `getline(cin, s)` for a whole line.", "Reading an `int` from `3.7` takes `3` and leaves `.7` in the buffer.", "If a read fails (letters instead of a number), the stream enters a fail state and the variable becomes `0`."], "ar": ["`cin >> x` تتجاوز المسافات والأسطر الجديدة، وتقرأ قيمة واحدة، وتتوقف عند أول whitespace.", "قراءة `string` بـ `>>` تعطي **كلمة واحدة**. استخدم `getline(cin, s)` لقراءة سطر كامل.", "قراءة `int` من `3.7` تأخذ `3` وتترك `.7` في الـ buffer.", "إذا فشلت القراءة (حروف بدل رقم) يدخل الـ stream في حالة فشل (fail state) ويصبح المتغير `0`."]}, {"t": "code", "code": "int a, b;\ncin >> a >> b;\ncout << a << \" \" << b << endl;", "stdin": "3.7 5\n", "out": "3 0", "en": "`a` gets 3. For `b`, the next characters are `.7`, which is not an int, so the read fails and `b` is 0. The 5 is never read.", "ar": "`a` تأخذ 3. بالنسبة لـ `b` فالمحارف التالية `.7` وهي ليست int، فتفشل القراءة وتصبح `b` ‏0. والرقم 5 لا يُقرأ أصلاً."}, {"t": "code", "code": "char a, b;\ncin >> a >> b;\ncout << a << b << endl;", "stdin": "h   i\n", "out": "hi", "en": "`cin >>` skips the spaces between characters.", "ar": "`cin >>` تتجاوز المسافات بين الأحرف."}, {"t": "code", "code": "string name;\ncin >> name;\ncout << name << endl;", "stdin": "Ali Ahmad\n", "out": "Ali", "en": "`cin >> string` stops at the first space.", "ar": "`cin >> string` تتوقف عند أول مسافة."}, {"t": "p", "en": "**The classic bug:** after `cin >> age`, the newline you typed is still waiting in the buffer. The next `getline` reads that empty rest of the line. Fix it with `cin.ignore()`.", "ar": "**الخطأ الكلاسيكي:** بعد `cin >> age` يبقى سطر جديد (newline) الذي كتبته في الـ buffer. فتقرأ الـ `getline` التالية هذا الباقي الفارغ. الحل: `cin.ignore()`."}, {"t": "code", "code": "int age; string name;\ncin >> age;\ngetline(cin, name);\ncout << \"[\" << name << \"]\" << endl;", "stdin": "25\nAli Ahmad\n", "out": "[]", "en": "The name is lost: `getline` consumed only the leftover newline.", "ar": "ضاع الاسم: الـ `getline` قرأت الـ newline المتبقي فقط."}, {"t": "code", "code": "int age; string name;\ncin >> age;\ncin.ignore(100, '\\n');\ngetline(cin, name);\ncout << \"[\" << name << \"]\" << endl;", "stdin": "25\nAli Ahmad\n", "out": "[Ali Ahmad]", "en": "With `cin.ignore`, the leftover newline is discarded first.", "ar": "مع `cin.ignore` يُتخلَّص من الـ newline المتبقي أولاً."}, {"t": "trap", "en": "`cin >> number` followed by `getline` needs `cin.ignore()` in between.", "ar": "عند استخدام `cin >> number` ثم `getline` يلزم وضع `cin.ignore()` بينهما."}]}, {"id": "sec-9", "num": "3.3", "title_en": "Built-in functions", "title_ar": "الدوال الجاهزة", "blocks": [{"t": "list", "ordered": false, "en": ["`<cmath>`: `pow(x, y)`, `sqrt(x)`, `floor(x)` (round down), `ceil(x)` (round up), `fabs(x)`. These return a `double`, so `pow(2, 3)` prints `8`.", "`<cctype>`: `toupper(c)`, `tolower(c)`, `isdigit(c)`, `isalpha(c)`, `isupper`, `islower`, `isspace`.", "`<fstream>`: `ofstream` writes to a file and `ifstream` reads from one, using the same `<<` and `>>`."], "ar": ["`<cmath>`: ‏`pow(x, y)` و`sqrt(x)` و`floor(x)` (تقريب للأسفل) و`ceil(x)` (تقريب للأعلى) و`fabs(x)`. هذه ترجع `double`، لذلك `pow(2, 3)` تُطبع `8`.", "`<cctype>`: ‏`toupper(c)` و`tolower(c)` و`isdigit(c)` و`isalpha(c)` و`isupper` و`islower` و`isspace`.", "`<fstream>`: ‏`ofstream` للكتابة في ملف و`ifstream` للقراءة منه، بنفس `<<` و`>>`."]}, {"t": "code", "code": "cout << pow(2, 3) << endl;\ncout << pow(2, 0.5) << endl;\ncout << sqrt(16) << endl;\ncout << floor(3.9) << \" \" << ceil(3.1) << endl;\ncout << floor(-3.1) << \" \" << ceil(-3.9) << endl;\ncout << abs(-5) << \" \" << fabs(-5.5) << endl;\ncout << pow(2, 3) / 3 << endl;\ncout << toupper('a') << endl;\ncout << (char)toupper('a') << endl;\nchar c = toupper('a');\ncout << c << endl;", "stdin": null, "out": "8\n1.41421\n4\n3 4\n-4 -3\n5 5.5\n2.66667\n65\nA\nA", "en": "`floor(-3.1)` is `-4` (down) and `ceil(-3.9)` is `-3` (up). `toupper` returns an **int**, so printing it directly shows 65.", "ar": "`floor(-3.1)` تساوي `-4` (للأسفل) و`ceil(-3.9)` تساوي `-3` (للأعلى). الدالة `toupper` ترجع **int**، لذلك طباعتها مباشرة تعطي 65."}, {"t": "code", "code": "ofstream out(\"data.txt\");\nout << 10 << \" \" << 20 << endl;\nout.close();\nifstream in(\"data.txt\");\nint a, b;\nin >> a >> b;\ncout << a + b << endl;\nin.close();", "stdin": null, "out": "30", "en": "Write two numbers to a file, read them back, and add them.", "ar": "نكتب عددين في ملف ثم نقرأهما ونجمعهما."}, {"t": "trap", "en": "`cout << toupper('a')` prints **65**. Store the result in a `char` or cast it to see `A`.", "ar": "`cout << toupper('a')` تطبع **65**. خزّن النتيجة في `char` أو حوّلها بـ cast لترى `A`."}]}], "quiz": [{"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << 2.0;", "stdin": null, "options": ["2.0", "2", "2.000000", "2.00"], "answer": 1, "why_en": "`cout` removes the useless `.0`.", "why_ar": "الـ `cout` يحذف الـ `.0` غير المفيد.", "mono": true, "id": "sec-7-q0", "n": 1, "tag": "3.1 · Output: cout and formatting", "ref": "sec-7:2", "ref_label": "3.1 · Output: cout and formatting", "idea_en": "By default `cout` prints at most 6 significant digits, drops useless zeros (`2.0` prints `2`), and may switch to scientific notation.", "idea_ar": "افتراضياً يطبع `cout` حتى 6 أرقام معنوية، ويحذف الأصفار غير المفيدة (`2.0` تُطبع `2`)، وقد يتحول إلى الصيغة العلمية."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << fixed << setprecision(2) << 3.14159;", "stdin": null, "options": ["3.14159", "3.1", "3.15", "3.14"], "answer": 3, "why_en": "With `fixed`, the precision counts digits after the point: 3.14.", "why_ar": "مع `fixed` تعدّ الدقة الأرقام بعد الفاصلة: 3.14.", "mono": true, "id": "sec-7-q1", "n": 2, "tag": "3.1 · Output: cout and formatting", "ref": "sec-7:4", "ref_label": "3.1 · Output: cout and formatting", "idea_en": "`fixed` with `setprecision(n)` gives n decimals. `setprecision(n)` alone gives n significant digits in total. `setw(n)` pads only the next item, right-aligned. `boolalpha` prints true/false.", "idea_ar": "‏`fixed` مع `setprecision(n)` تعطي n خانة عشرية. و`setprecision(n)` وحدها تعطي n رقماً معنوياً بالمجموع. و`setw(n)` تملأ العنصر التالي فقط ومحاذاته لليمين. و`boolalpha` تطبع true/false."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "cout << setprecision(3) << 1234.5678;", "stdin": null, "options": ["1234.57", "1.235e+03", "1.23e+03", "1234.568"], "answer": 2, "why_en": "Without `fixed`, 3 is the number of significant digits. 1234.5678 needs scientific notation: 1.23e+03.", "why_ar": "بدون `fixed` يعني الرقم 3 عدد الأرقام المعنوية. العدد 1  \"]\";", "stdin": "25\nAli Ahmad\n", "options": ["[]", "[Ali]", "[Ali Ahmad]", "[25]"], "answer": 2, "why_en": "`cin.ignore` throws away the leftover newline, so `getline` reads the full second line.", "why_ar": "الـ `cin.ignore` تتخلص من الـ newline المتبقي فتقرأ `getline` السطر الثاني كاملاً.", "mono": true, "id": "sec-8-q3", "n": 10, "tag": "3.2 · Input: cin and getline", "ref": "sec-8:4", "ref_label": "3.2 · Input: cin and getline", "idea_en": "After `cin >> number` the newline stays in the buffer, so the next `getline` reads that empty rest. `cin.ignore()` throws it away first.", "idea_ar": "بعد `cin >> number` يبقى الـ newline في الـ buffer فتقرأ الـ `getline` التالية هذا الباقي الفارغ. الـ `cin.ignore()` تتخلص منه أولاً."}, {"stem_en": "What does this program print?", "stem_ar": "ماذا يطبع هذا البرنامج؟", "code": "char c1, c2;\ncin >> c1 >> c2;\ncout << c1 + c2;", "stdin": "A B\n", "options": ["A B", "65", "131", "AB"], "answer": 2, "why_en": "Adding two chars gives an int: 65 + 66 = 131.", "why_ar": "جمع حرفين يعطي int: 65 + 66 = 131.", "mono": true, "id": "sec-8-q4", "n": 11, "tag": "3.2 · Input: cin and getline", "ref": "sec-5:2", "ref_label": "2.4 · Casting and the char type", "idea_en": "In arithmetic a char is its ASCII number: `'A' + 1` is 66. Use `char(...)` to turn a number back into a letter. A digit character minus `'0'` gives the digit.", "idea_ar": "في الحساب يُعامل الـ char كرقم ASCII الخاص به: `'A' + 1` تساوي 66. استخدم `char(...)` لإرجاع الرقم إلى حرف. وطرح `'0'` من حرف رقم يعطي الرقم نفسه."}, {"stem_en": "What is `cin.ignore()` used for before a `getline`?", "stem_ar": "لماذا نستخدم `cin.ignore()` قبل `getline`؟", "code": null, "stdin": null, "options": ["To close the input stream", "To discard the leftover newline in the input buffer", "To clear the screen", "To convert the input to upper case"], "answer": 1, "why_en": "It removes the characters (usually the newline) still waiting in the buffer.", "why_ar": "تزيل المحارف (غالباً الـ newline
